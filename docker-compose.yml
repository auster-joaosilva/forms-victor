services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.austercontabil.com.br}
      S3_BUCKET: ${S3_BUCKET:-forms-victor}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_UPLOAD_URL_TTL_MINUTOS: ${S3_UPLOAD_URL_TTL_MINUTOS:-15}
    expose:
      - 3000
    networks:
      - dokploy-network
      - shared-postgres

networks:
  dokploy-network:
    external: true
  shared-postgres:
    external: true
