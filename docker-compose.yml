# Stack local para Dokploy: app + Postgres + MinIO.
#
# S3_ENDPOINT_PUBLICO e o endereco que o NAVEGADOR usa no PUT assinado. A
# assinatura carrega o host, entao ele nao pode ser `http://minio:9000` — esse
# nome so existe dentro da rede do compose. Publicando 9000 no host, o padrao
# abaixo serve; com dominio no Dokploy, aponte para o dominio do MinIO.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-bucket:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-victor}:${POSTGRES_PASSWORD:-victor}@postgres:5432/${POSTGRES_DB:-victor_forms}
      S3_ENDPOINT: ${S3_ENDPOINT_PUBLICO:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-auster-formularios}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_UPLOAD_URL_TTL_MINUTOS: ${S3_UPLOAD_URL_TTL_MINUTOS:-15}
    ports:
      - '${APP_PORT:-3000}:3000'
    networks:
      - interna
      - dokploy-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-victor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-victor}
      POSTGRES_DB: ${POSTGRES_DB:-victor_forms}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-victor} -d ${POSTGRES_DB:-victor_forms}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    networks:
      - interna

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # PUT assinado sai do navegador: sem CORS liberado, o preflight barra.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGIN:-*}
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-dados:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    networks:
      - interna
      - dokploy-network

  # Cria o bucket e encerra.
  minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-auster-formularios}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\" &&
      echo bucket \"$$S3_BUCKET\" pronto
      "
    networks:
      - interna

volumes:
  postgres-dados:
  minio-dados:

networks:
  interna:
  # Rede do Traefik do Dokploy. Remova este bloco e as referencias em `app` e
  # `minio` para rodar com `docker compose up` fora do Dokploy.
  dokploy-network:
    external: true
