# Dokploy: apontar para este arquivo e definir as variaveis no painel.
# AUSTER_SENHA_BACKOFFICE e obrigatoria — sem ela o servidor se recusa a subir.
services:
  portal:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      AUSTER_BANCO: /app/dados/portal.db
      # Definir no painel do Dokploy, NUNCA aqui:
      AUSTER_SENHA_BACKOFFICE: ${AUSTER_SENHA_BACKOFFICE:?defina no painel}
      AUSTER_ENDERECO_PUBLICO: ${AUSTER_ENDERECO_PUBLICO:-}
    volumes:
      - dados:/app/dados
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dados:
