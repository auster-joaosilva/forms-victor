services:
  app:
    build: .
    image: forms-victor-app:latest
    pull_policy: build
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL:?defina no painel}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_USE_SSL: 'false'
      S3_BUCKET: ${S3_BUCKET:?defina no painel}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?defina no painel}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?defina no painel}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina no painel}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?defina no painel}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?defina no painel}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      LEGACY_DB_PATH: ${LEGACY_DB_PATH:-/legacy/portal.db}
      ALLOW_TEST_DATA_RESET: ${ALLOW_TEST_DATA_RESET:-false}
    volumes:
      - legacy-data:/legacy
    networks:
      - dokploy-network
      - shared-postgres
      - shared-minio

volumes:
  legacy-data:
    external: true
    name: ${LEGACY_VOLUME_NAME:?defina no painel}

networks:
  dokploy-network:
    external: true
  shared-postgres:
    external: true
  shared-minio:
    external: true
