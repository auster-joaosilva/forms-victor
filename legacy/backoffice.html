<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Conferência — Diagnóstico Simples | auster</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --escuro:#052C47; --claro:#71CFEB; --acento:#007E99;
  --tinta:#052C47; --cinza:#5b6b78; --fundo:#f1f5f8;
  --borda:#cfd9e0; --borda-forte:#8496a5;
  --sombra:0 1px 2px rgba(5,44,71,.06), 0 4px 12px rgba(5,44,71,.05);
  --alto:#b63b32; --medio:#9a6608; --baixo:#2f7d52;
  --t-meta:12px; --t-corpo:14px; --t-destaque:16px; --t-titulo:20px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font-family:Kanit,Montserrat,Raleway,Arial,sans-serif;font-weight:300;
  font-size:var(--t-corpo);line-height:1.55}
header{background:var(--escuro);color:#fff;padding:16px 24px;display:flex;
  justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
/* A marca vem da variante NEGATIVA: o cabeçalho é #052C47, e a positiva
   sumiria no fundo. Inverter a negativa por filtro, não — leva #70CEEC a
   marrom. */
header .marca{display:flex;align-items:center;gap:16px}
header .logo{height:38px;width:auto;display:block}
header h1{margin:0;font-size:var(--t-titulo);font-weight:300;line-height:1.2}
header .linha-fina{color:var(--claro);font-size:var(--t-meta);margin-top:2px}
header .acoes-cabecalho{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header .quem{color:var(--claro);font-size:var(--t-meta)}
header .sair{padding:9px 16px;border:1px solid var(--borda-forte);border-radius:7px;
  background:#fff;color:var(--escuro);text-decoration:none;font-size:var(--t-meta)}
@media (max-width:640px){
  header{padding:14px 16px}
  header .logo{height:30px}
  header .linha-fina{display:none}
}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.aba{padding:9px 16px;border:1px solid var(--borda-forte);border-radius:7px;background:#fff;
  cursor:pointer;font-family:inherit;font-size:var(--t-corpo);color:var(--escuro)}
.aba.ativa{background:var(--escuro);color:#fff;border-color:var(--escuro)}
.aba.oculta{display:none}
#formSenha input{display:block;width:100%;margin-bottom:10px;padding:10px 12px;
  border:1px solid var(--borda-forte);border-radius:7px;font:inherit}
.erro-senha{color:#a4262c;font-size:var(--t-meta);min-height:18px;margin-bottom:6px}
.papel{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;
  border:1px solid var(--borda-forte);border-radius:20px;padding:2px 9px}
.papel.admin{background:var(--escuro);color:#fff;border-color:var(--escuro)}
.inativo{opacity:.55}
.painel{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:20px 22px;
  box-shadow:var(--sombra)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input[type=text],select,textarea{padding:9px 11px;border:1px solid var(--borda-forte);
  border-radius:7px;font-family:inherit;font-size:var(--t-corpo);font-weight:300;background:#fff}
input[type=text]{min-width:230px}
textarea{width:100%;min-height:74px;resize:vertical}
button{font-family:inherit;font-size:var(--t-corpo);font-weight:500;padding:9px 18px;
  border-radius:7px;border:1px solid var(--escuro);background:var(--escuro);color:#fff;cursor:pointer}
button.claro{background:#fff;color:var(--escuro)}
button:disabled{opacity:.4;cursor:default}
table{width:100%;border-collapse:collapse;font-size:var(--t-corpo)}
th{text-align:left;font-weight:500;font-size:var(--t-meta);text-transform:uppercase;
  letter-spacing:.7px;color:var(--cinza);padding:8px 10px;border-bottom:1px solid var(--borda-forte)}
td{padding:11px 10px;border-bottom:1px solid var(--borda);vertical-align:top}
tr.linha:hover{background:#f7fafc;cursor:pointer}
.selo{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11.5px;
  white-space:nowrap}
.a-recebida{background:#fdf4e3;color:#7a5200}
.a-protocolada{background:#eaf5ee;color:#1f5c3b}
.a-cancelada{background:#f1f1f1;color:#5b6b78}
.aviso-prazo{background:#fdf4e3;border:1px solid #e3d3ab;border-left:4px solid var(--medio);
  border-radius:9px;padding:14px 16px;margin-bottom:16px}
.s-nova{background:#dff0f5;color:#00596b}
.s-em_analise{background:#fdf4e3;color:#7a5200}
.s-validada{background:#eaf5ee;color:#1f5c3b}
.s-descartada{background:#eef3f6;color:var(--cinza)}
.u-ALTA{background:#fdeceb;color:var(--alto)}
.u-MÉDIA{background:#fdf4e3;color:var(--medio)}
.u-BAIXA{background:#eaf5ee;color:var(--baixo)}
.contagem{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.caixa{background:#fff;border:1px solid var(--borda);border-radius:9px;padding:13px 17px;
  box-shadow:var(--sombra);min-width:118px}
.caixa .rot{font-size:var(--t-meta);color:var(--cinza);text-transform:uppercase;letter-spacing:.6px}
.caixa .val{font-size:22px;font-weight:400;margin-top:3px}
.vazio{color:var(--cinza);padding:26px 0;text-align:center}
dialog{border:0;border-radius:12px;padding:0;max-width:900px;width:94%;
  box-shadow:0 20px 60px rgba(5,44,71,.3)}
dialog::backdrop{background:rgba(5,44,71,.45)}
.ficha{padding:26px 28px}
.ficha h2{margin:0 0 4px;font-size:var(--t-titulo);font-weight:400}
.ficha .prot{color:var(--cinza);font-size:var(--t-meta);letter-spacing:.8px;text-transform:uppercase}
.ficha .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:18px 0}
.ficha .item .rot{font-size:var(--t-meta);color:var(--cinza)}
.ficha .item .val{font-weight:500}
.ficha h3{font-size:var(--t-corpo);text-transform:uppercase;letter-spacing:.8px;
  color:var(--cinza);margin:22px 0 8px;font-weight:500}
.respostas{border:1px solid var(--borda);border-radius:8px;max-height:280px;overflow:auto}
.respostas div{display:flex;gap:12px;padding:7px 12px;border-bottom:1px solid var(--borda);font-size:var(--t-meta)}
.respostas div:last-child{border-bottom:0}
.respostas .k{flex:0 0 42%;color:var(--cinza)}
.respostas .v{flex:1;font-weight:500}
.alerta-qsa{background:#fdf4e3;border:1px solid #f0dcb4;border-radius:7px;padding:11px 13px;
  font-size:var(--t-meta);line-height:1.55;margin:14px 0}
.acoes-ficha{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;padding-top:16px;
  border-top:1px solid var(--borda)}
.link-convite{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--t-meta);
  background:#f1f5f8;padding:3px 7px;border-radius:5px;word-break:break-all}
.nota{font-size:var(--t-meta);color:var(--cinza);line-height:1.6;margin:14px 0 0;max-width:80ch}
/* Campos do painel de eventos: rótulo visível acima, nunca dentro do campo. */
/* Galeria das fotos da casa. Miniatura, e nao lista de nomes: ninguem sabe
   qual e "fachada-auster-lateral" sem ver. */
.galeria{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.miniatura{padding:0;border:2px solid var(--borda);border-radius:8px;overflow:hidden;
  background:#fff;cursor:pointer;width:96px}
.miniatura:hover{border-color:var(--claro)}
.miniatura.escolhida{border-color:var(--escuro);box-shadow:0 0 0 2px rgba(5,44,71,.18)}
.miniatura img{display:block;width:100%;height:64px;object-fit:cover}
.miniatura .nome{display:block;font-size:10.5px;color:var(--cinza);padding:3px 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniatura.nenhuma{width:96px;height:88px;display:flex;align-items:center;
  justify-content:center;font-size:11.5px;color:var(--cinza)}
.campo-bo{margin-bottom:12px}
.campo-bo label{display:block;font-size:var(--t-meta);color:var(--cinza);margin-bottom:4px;
  text-transform:uppercase;letter-spacing:.7px}
.campo-bo input[type=text],.campo-bo textarea{width:100%;max-width:none}
.campo-bo textarea{min-height:64px}
.campos-bo{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:700px){ .campos-bo{grid-template-columns:1fr} }
#tabelaSessoes input,#tabelaSessoes select{min-width:0;width:100%}
#tabelaSessoes td{padding:6px 5px}
</style>
</head>
<body>
<header>
  <div class="marca">
    <img class="logo" alt="auster" src="data:image/png;base64,/*__LOGO__*/">
    <div>
      <h1>Conferência</h1>
      <div class="linha-fina">Diagnóstico e termos de opção — Simples Nacional 2027</div>
    </div>
  </div>
  <div class="acoes-cabecalho">
    <span class="quem" id="quem"></span>
    <button class="claro" id="minhaSenha" onclick="window.trocarMinhaSenha()">Trocar minha senha</button>
    <a class="sair" href="/sair">Sair</a>
  </div>
</header>
<main>
  <div class="abas">
    <button class="aba ativa" data-aba="respostas">Respostas</button>
    <button class="aba" data-aba="adesoes">Adesões</button>
    <button class="aba" data-aba="eventosAgenda">Eventos</button>
    <button class="aba" data-aba="convites">Convites</button>
    <button class="aba" data-aba="eventos">Auditoria</button>
    <button class="aba oculta" data-aba="usuarios" id="abaUsuarios">Usuários</button>
  </div>
  <div id="conteudo" class="painel">carregando…</div>
</main>
<dialog id="ficha"><div class="ficha" id="corpoFicha"></div></dialog>
<dialog id="dlgSenha"><form class="ficha" id="formSenha" method="dialog">
  <h3 id="tituloSenha" style="margin:0 0 4px">Definir senha</h3>
  <p class="nota" id="regraSenha" style="margin:0 0 14px"></p>
  <input type="password" id="senha1" placeholder="Senha" autocomplete="new-password">
  <input type="password" id="senha2" placeholder="Repita a senha" autocomplete="new-password">
  <div class="erro-senha" id="erroSenha"></div>
  <div class="acoes-ficha">
    <button value="ok">Definir</button>
    <button class="claro" value="cancelar">Cancelar</button>
  </div>
</form></dialog>

<script>
/*__QUEM__*/
const quem = (typeof window.__QUEM__ === 'string') ? window.__QUEM__ : 'equipe';
const papel = (typeof window.__PAPEL__ === 'string') ? window.__PAPEL__ : 'equipe';
const porImplantacao = window.__IMPLANTACAO__ === true;
const ehAdmin = papel === 'admin';
document.getElementById('quem').textContent = quem;

/* Escapa tambem o apostrofo: atributo em aspas simples e lugar legitimo no
   codigo, e sem isto um nome de empresa com ' escaparia do atributo. */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const conteudo = document.getElementById('conteudo');
const ficha = document.getElementById('ficha');
const corpoFicha = document.getElementById('corpoFicha');
let abaAtual = 'respostas';
let filtroSituacao = '', filtroBusca = '';

const SITUACOES = { nova:'Nova', em_analise:'Em análise', validada:'Validada', descartada:'Descartada' };

const quando = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d) ? '—' : d.toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' });
};

/* Dicionário do formulário: enunciado de cada pergunta e rótulo de cada opção.
   Vem do servidor, que o monta da MESMA fonte que gera o formulário. Sem ele a
   ficha mostrava `pesoMercadorias: de_20_40`, e resposta completa parecia
   incompleta. */
let DICIONARIO = null;

async function carregarDicionario() {
  if (DICIONARIO) return DICIONARIO;
  try {
    DICIONARIO = await pedir('/api/backoffice/dicionario');
    DICIONARIO.porChave = new Map(DICIONARIO.perguntas.map(p => [p.chave, p]));
  } catch (e) {
    DICIONARIO = { perguntas: [], blocos: [], porChave: new Map() };
  }
  return DICIONARIO;
}

/** Valor legível. Valor fora do dicionário volta como está — inventar rótulo
 *  esconderia divergência entre o formulário de hoje e uma resposta antiga. */
function valorLegivel(pergunta, valor) {
  if (valor === undefined || valor === null || valor === '') return '—';
  if (pergunta && pergunta.tipo === 'matriz' && typeof valor === 'object') {
    return pergunta.linhas.map(([lc, lr]) => {
      const v = valor[lc];
      if (!v) return null;
      const col = pergunta.colunas.find(([cv]) => cv === v);
      return `${esc(lr)}: <b>${esc(col ? col[1] : v)}</b>`;
    }).filter(Boolean).join('<br>');
  }
  if (typeof valor === 'object') return esc(JSON.stringify(valor));
  const achado = pergunta && pergunta.opcoes.find(([v]) => v === valor);
  return esc(achado ? achado[1] : valor);
}

async function pedir(rota, opcoes) {
  const r = await fetch(rota, opcoes);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// ----------------------------------------------------------------- respostas
async function verRespostas() {
  const q = new URLSearchParams();
  if (filtroSituacao) q.set('situacao', filtroSituacao);
  if (filtroBusca) q.set('busca', filtroBusca);
  const { contagem, respostas } = await pedir('/api/backoffice/respostas?' + q);

  const caixas = ['total', ...Object.keys(SITUACOES)].map(k => `
    <div class="caixa"><div class="rot">${k === 'total' ? 'Total' : SITUACOES[k]}</div>
      <div class="val">${contagem[k] ?? 0}</div></div>`).join('');

  const linhas = respostas.map(r => `
    <tr class="linha" onclick="abrirFicha(${r.id})">
      <td><b>${esc(r.nome_empresa || '(sem nome)')}</b><br>
          <span style="color:var(--cinza);font-size:var(--t-meta)">${esc(r.cnpj || '')}</span></td>
      <td>${esc(r.solicitante || '—')}<br>
          <span style="color:var(--cinza);font-size:var(--t-meta)">${esc(r.email || '')}</span></td>
      <td>${esc(r.posicao || '—')}<br>
          <span style="color:var(--cinza);font-size:var(--t-meta)">saída ${esc(r.saida || '—')} ·
          ${r.certeza === 'fechada' ? 'fechada' : 'aberta'}</span></td>
      <td><span class="selo u-${esc(r.urgencia || 'BAIXA')}">${esc(r.urgencia || '—')}</span><br>
          <span style="color:var(--cinza);font-size:var(--t-meta)">confiança ${esc(r.confianca || '—')}</span></td>
      <td>${quando(r.recebido_em)}<br>
          <span style="color:var(--cinza);font-size:var(--t-meta)">${esc(r.versao || '')}${r.token_convite ? ' · convite' : ''}</span></td>
      <td><span class="selo s-${esc(r.situacao)}">${esc(SITUACOES[r.situacao] || r.situacao)}</span></td>
    </tr>`).join('');

  conteudo.innerHTML = `
    <div class="contagem">${caixas}</div>
    <div class="filtros">
      <input type="text" id="busca" placeholder="Empresa, CNPJ, protocolo ou respondente"
        value="${esc(filtroBusca)}">
      <select id="situacao">
        <option value="">Todas as situações</option>
        ${Object.entries(SITUACOES).map(([k, v]) =>
          `<option value="${k}" ${filtroSituacao === k ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
      <button class="claro" onclick="aplicarFiltro()">Filtrar</button>
      <button class="claro" onclick="baixarPlanilha()">Baixar planilha (CSV)</button>
    </div>
    ${respostas.length ? `<table><thead><tr>
      <th>Empresa</th><th>Quem respondeu</th><th>Posição</th><th>Urgência</th>
      <th>Recebido</th><th>Situação</th></tr></thead><tbody>${linhas}</tbody></table>`
      : '<div class="vazio">Nenhuma resposta com esse filtro. Limpe a busca ou escolha outra situação.</div>'}
    <p class="nota">A conferência existe porque a resposta é autodeclarada. Antes de virar
    trabalho, alguém da casa precisa olhar o CNPJ, o anexo e a alíquota — e é nesta tela que
    isso fica registrado, com autor e data.</p>`;

  document.getElementById('busca').addEventListener('keydown', e => {
    if (e.key === 'Enter') aplicarFiltro();
  });
}

window.aplicarFiltro = () => {
  filtroBusca = document.getElementById('busca').value.trim();
  filtroSituacao = document.getElementById('situacao').value;
  verRespostas();
};

window.abrirFicha = async id => {
  const { resposta } = await pedir('/api/backoffice/resposta?id=' + id);
  const p = resposta.pacote || {};
  const d = p.diagnostico || {};
  const r = p.respostas || {};

  const item = (rot, val) => `<div class="item"><div class="rot">${rot}</div>
    <div class="val">${esc(val ?? '—')}</div></div>`;

  const dic = await carregarDicionario();
  // Ordem do formulário, não ordem de chave: é assim que a pessoa respondeu, e
  // é assim que a equipe confere.
  const respondidas = new Set(Object.keys(r).filter(k => k !== 'aceiteLgpd'));
  const porBloco = (dic.blocos || []).map(b => {
    const linhas = (dic.perguntas || [])
      .filter(p => p.bloco === b.numero && respondidas.has(p.chave))
      .map(p => {
        respondidas.delete(p.chave);
        return `<div><span class="k">${esc(p.enunciado)}</span>
          <span class="v">${valorLegivel(p, r[p.chave])}</span></div>`;
      }).join('');
    return linhas ? `<h4 style="margin:14px 0 6px;font-size:11.5px;text-transform:uppercase;
      letter-spacing:.9px;color:var(--cinza)">${esc(b.numero + '. ' + b.titulo)}</h4>
      <div class="respostas">${linhas}</div>` : '';
  }).join('');
  // Sobrou alguma chave que o formulário de hoje não conhece? Mostra do mesmo
  // jeito: resposta antiga não pode desaparecer da ficha por mudança de esquema.
  const orfas = [...respondidas].map(k => `<div><span class="k">${esc(k)}</span>
    <span class="v">${valorLegivel(null, r[k])}</span></div>`).join('');
  const respostasLista = porBloco
    + (orfas ? `<h4 style="margin:14px 0 6px;font-size:11.5px;text-transform:uppercase;
        letter-spacing:.9px;color:#7a5200">fora do formulário atual</h4>
        <div class="respostas">${orfas}</div>` : '');

  const total = Object.keys(r).filter(k => k !== 'aceiteLgpd').length;

  const qsa = resposta.solicitante_no_qsa;
  corpoFicha.innerHTML = `

// ------------------------------------------------------------------- adesões
/* A adesão é de outra natureza que a resposta: aqui há prazo e há ato a
   praticar. O número que manda nesta tela é "a protocolar" — híbrido
   confirmado e ainda não feito no Portal do Simples Nacional. */
const SITUACOES_ADESAO = { recebida:'Recebida', protocolada:'Protocolada', cancelada:'Cancelada' };
const MODALIDADES = { padrao:'Simples Padrão', hibrido:'Simples Híbrido' };
const SEM_MANIFESTACAO = { cancelar:'cancela em 20/11', manter:'mantém em 20/11' };
let filtroModalidade = '', filtroSituacaoAdesao = '', filtroBuscaAdesao = '';

async function verAdesoes() {
  const q = new URLSearchParams();
  if (filtroSituacaoAdesao) q.set('situacao', filtroSituacaoAdesao);
  if (filtroModalidade) q.set('modalidade', filtroModalidade);
  if (filtroBuscaAdesao) q.set('busca', filtroBuscaAdesao);
  const { contagem, adesoes } = await pedir('/api/backoffice/adesoes?' + q);

  const caixas = [['total','Total'], ['hibrido','Híbrido'], ['padrao','Padrão'],
                  ['aProtocolar','A protocolar'], ['protocolada','Protocoladas']]
    .map(([k, rot]) => `<div class="caixa"><div class="rot">${rot}</div>
      <div class="val">${contagem[k] ?? 0}</div></div>`).join('');

  const linhas = adesoes.map(a => `
    <tr>
      <td><b>${esc(a.nome_empresa || '(sem nome)')}</b><br>
        <span style="color:var(--cinza);font-size:var(--t-meta)">${esc(a.cnpj || '')}</span></td>
      <td>${esc(a.representante || '—')}<br>
        <span style="color:var(--cinza);font-size:var(--t-meta)">${esc(a.cargo || '')} ·
        ${esc(a.email || '')}</span></td>
      <td><b>${esc(MODALIDADES[a.modalidade] || a.modalidade)}</b>${a.sem_manifestacao
        ? `<br><span style="color:var(--cinza);font-size:var(--t-meta)">${esc(SEM_MANIFESTACAO[a.sem_manifestacao] || '')}</span>` : ''}</td>
      <td>${quando(a.aceito_em)}<br>
        <span style="color:var(--cinza);font-size:var(--t-meta)">${esc(a.protocolo)}</span></td>
      <td><span class="selo a-${esc(a.situacao)}">${esc(SITUACOES_ADESAO[a.situacao] || a.situacao)}</span>
        ${a.quer_proposta ? '<br><span class="selo s-em_analise">quer proposta</span>' : ''}</td>
      <td style="white-space:nowrap">
        <button class="claro" onclick="window.abrirTermo(${a.id})">Termo (PDF)</button>
        ${a.modalidade === 'hibrido' && a.situacao === 'recebida'
          ? `<button onclick="window.marcarAdesao(${a.id},'protocolada')">Protocolei</button>` : ''}
        ${a.situacao !== 'cancelada'
          ? `<button class="claro" onclick="window.marcarAdesao(${a.id},'cancelada')">Cancelar</button>` : ''}
      </td>
    </tr>`).join('');

  conteudo.innerHTML = `
    <div class="contagem">${caixas}</div>
    ${contagem.aProtocolar
      ? `<div class="aviso-prazo"><b>${contagem.aProtocolar}</b>
          ${contagem.aProtocolar === 1 ? 'empresa autorizou' : 'empresas autorizaram'} a opção
          pelo Híbrido e ainda não ${contagem.aProtocolar === 1 ? 'foi feita' : 'foram feitas'}
          no Portal do Simples Nacional. ${janelaEncerrada()
            ? '<b>O prazo terminou em 30/09/2026.</b> Estas não podem mais ser '
              + 'protocoladas: trate uma a uma e registre o que foi combinado com '
              + 'cada empresa.'
            : '<b>O prazo é 30/09/2026.</b>'}</div>`
      : ''}
    <div class="filtros">
      <input type="text" id="buscaAdesao" placeholder="Empresa, CNPJ, protocolo ou representante"
        value="${esc(filtroBuscaAdesao)}">
      <select id="modalidadeAdesao">
        <option value="">Todas as modalidades</option>
        ${Object.entries(MODALIDADES).map(([k, v]) =>
          `<option value="${k}" ${filtroModalidade === k ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
      <select id="situacaoAdesao">
        <option value="">Todas as situações</option>
        ${Object.entries(SITUACOES_ADESAO).map(([k, v]) =>
          `<option value="${k}" ${filtroSituacaoAdesao === k ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
      <button class="claro" onclick="window.filtrarAdesoes()">Filtrar</button>
      <button class="claro" onclick="window.baixarPlanilhaAdesoes()">Baixar planilha (CSV)</button>
    </div>
    ${adesoes.length ? `<table><thead><tr>
      <th>Empresa</th><th>Quem confirmou</th><th>Modalidade</th><th>Confirmado</th>
      <th>Situação</th><th></th></tr></thead><tbody>${linhas}</tbody></table>`
      : '<div class="vazio">Nenhuma adesão com esse filtro. Limpe a busca ou escolha outra modalidade.</div>'}
    <p class="nota">Confirmar aqui não protocola nada: a opção continua sendo feita à mão no
    Portal do Simples Nacional, empresa por empresa. Esta tela serve para ninguém ficar de fora
    e para registrar quem fez.</p>`;

  document.getElementById('buscaAdesao').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.filtrarAdesoes();
  });
}

window.filtrarAdesoes = () => {
  filtroBuscaAdesao = document.getElementById('buscaAdesao').value.trim();
  filtroModalidade = document.getElementById('modalidadeAdesao').value;
  filtroSituacaoAdesao = document.getElementById('situacaoAdesao').value;
  verAdesoes();
};

window.abrirTermo = id => { window.open('/backoffice/termo?id=' + id, '_blank'); };

window.baixarPlanilhaAdesoes = () => {
  const q = new URLSearchParams();
  if (filtroSituacaoAdesao) q.set('situacao', filtroSituacaoAdesao);
  if (filtroModalidade) q.set('modalidade', filtroModalidade);
  if (filtroBuscaAdesao) q.set('busca', filtroBuscaAdesao);
  window.location = '/api/backoffice/adesoes.csv' + (q.toString() ? '?' + q : '');
};

window.marcarAdesao = async (id, situacao) => {
  if (situacao === 'cancelada'
      && !confirm('Cancelar esta adesão? Use quando o cliente desistiu ou o termo saiu errado.')) {
    return;
  }
  const r = await fetch('/api/backoffice/adesoes/tratar', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, situacao }),
  }).then(x => x.json());
  if (!r.ok) { alert('Não consegui mudar a situação: ' + (r.motivo || r.erro || 'erro desconhecido') + '. Tente de novo.'); return; }
  verAdesoes();
};

// ------------------------------------------------------------------- eventos
/* Painel da agenda: a equipe cria e publica evento sem depender de alteração
   de código. O conteúdo da página vive em JSON no banco; aqui é só formulário.
   Listas vão em caixa de texto, uma por linha — é o que a equipe consegue
   editar sem treinamento, e o que não quebra ao colar de um documento. */
/* Os quatro fundos de capa. A lista vive aqui e na pagina publica; se as
   duas divergirem, o painel oferece um fundo que a pagina nao conhece e a
   capa cai no padrao sem avisar. O teste de invariante compara as duas. */
const TEMAS_DE_CAPA = [['marca', 'Marca — o símbolo, grande, na borda'],
                       ['foto', 'Foto — imagem ao lado do texto'],
                       ['aurora', 'Aurora — luz em diagonal'],
                       ['onda', 'Onda — faixas curvas'],
                       ['solido', 'Sólido — azul-escuro e nada mais']];
/* O aviso do prazo muda de texto depois do corte. A data vem do SERVIDOR,
   injetada em `window.__JANELA__`: o relogio da maquina de quem confere pode
   estar errado, e um aviso que diz "ainda da tempo" depois do prazo e pior
   que nenhum aviso. */
const janelaEncerrada = () =>
  (typeof window !== 'undefined' && window.__JANELA__ === 'encerrada');

const SITUACOES_EVENTO = { rascunho:'Rascunho', publicado:'Publicado', encerrado:'Encerrado' };
const SITUACOES_INSCRICAO = { inscrita:'Inscrita', confirmada:'Confirmada',
  presente:'Presente', ausente:'Ausente', cancelada:'Cancelada' };
let eventoAberto = null;   // id do evento em edição; null = lista

const linhas = v => String(v || '').split('\n').map(s => s.trim()).filter(Boolean);
const valor = id => (document.getElementById(id) || {}).value || '';
const dataCurta = iso => {
  const [a, m, d] = String(iso || '').split('-');
  return a ? `${d}/${m}/${a}` : (iso || '—');
};

async function verAgenda() {
  if (eventoAberto) return verEvento(eventoAberto);
  const { eventos, base } = await pedir('/api/backoffice/eventos');
  const linhasTabela = eventos.map(e => `
    <tr class="linha" onclick="window.abrirEvento(${e.id})">
      <td><b>${esc(e.titulo)}</b><br>
        <span style="color:var(--cinza);font-size:var(--t-meta)">/eventos/${esc(e.apelido)}</span></td>
      <td>${e.primeira_data ? esc(dataCurta(e.primeira_data)) : '—'}</td>
      <td><span class="selo s-${e.situacao === 'publicado' ? 'validada' : 'nova'}">${
        esc(SITUACOES_EVENTO[e.situacao] || e.situacao)}</span>
        ${e.inscricoes === 'encerradas' ? '<br><span class="selo a-cancelada">inscrições encerradas</span>' : ''}</td>
      <td><b>${e.inscritos || 0}</b></td>
    </tr>`).join('');

  conteudo.innerHTML = `
    <h2 style="margin:0 0 4px;font-size:var(--t-titulo);font-weight:400">Agenda de eventos</h2>
    <p class="nota" style="margin:0 0 18px">Cada evento vira uma página em
      <code>/eventos/apelido</code>, com inscrição por encontro. Enquanto está em
      <b>rascunho</b>, só quem tem sessão aqui consegue abrir o endereço — dá para conferir
      antes de divulgar.${base ? '' : ' <b>AUSTER_ENDERECO_PUBLICO não está definido</b>, então os links saem sem domínio.'}</p>
    <div class="filtros"><button onclick="window.novoEvento()">Novo evento</button></div>
    ${eventos.length ? `<table><thead><tr>
      <th>Evento</th><th>Primeira data</th><th>Situação</th><th>Inscritos</th>
      </tr></thead><tbody>${linhasTabela}</tbody></table>`
      : '<div class="vazio">Nenhum evento ainda. Use “Novo evento” para criar o primeiro.</div>'}`;
}

window.novoEvento = async () => {
  const titulo = prompt('Título do evento (dá para mudar depois):');
  if (!titulo || !titulo.trim()) return;
  const r = await fetch('/api/backoffice/eventos', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ titulo: titulo.trim(), conteudo: {}, sessoes: [] }),
  }).then(x => x.json());
  if (!r.ok) { alert('Não foi possível criar: ' + (r.motivo || 'erro')); return; }
  eventoAberto = r.evento.id;
  verAgenda();
};

window.abrirEvento = id => { eventoAberto = id; verAgenda(); };
window.voltarParaAgenda = () => { eventoAberto = null; verAgenda(); };

function campoSessao(s, i) {
  return `<tr data-sessao="${s.id || ''}">
    <td><input type="date" class="s-data" value="${esc(s.data || '')}" style="min-width:0"></td>
    <td><input type="text" class="s-hora" value="${esc(s.hora || '')}" placeholder="19:30"
        style="min-width:0;width:74px"></td>
    <td><select class="s-formato">
      <option value="presencial" ${s.formato !== 'online' ? 'selected' : ''}>Presencial</option>
      <option value="online" ${s.formato === 'online' ? 'selected' : ''}>Online</option>
    </select></td>
    <td><input type="text" class="s-titulo" value="${esc(s.titulo || '')}"
        placeholder="Encontro ${i + 1}" style="min-width:0"></td>
    <td><input type="text" class="s-local" value="${esc(s.local || '')}"

let fotosDaCasa = [];

/** Desenha a galeria de uma escolha. `alvo` e o mesmo nome usado em
 *  `escolherImagem`; `atual` e o que ja esta gravado. */
function galeria(alvo, atual, filtro) {
  const itens = fotosDaCasa.filter(f => !filtro || filtro.test(f.arquivo));
  if (!itens.length) return '';
  const botao = (caminho, rotulo, miniatura) => `<button type="button" class="miniatura${
    atual === caminho ? ' escolhida' : ''}${miniatura ? '' : ' nenhuma'}"
    onclick="window.escolherImagem('${alvo}', '${caminho}')">${
    miniatura ? `<img src="${esc(caminho)}" alt=""><span class="nome">${esc(rotulo)}</span>`
              : rotulo}</button>`;
  return `<div class="galeria" id="galeria-${alvo}">
    ${itens.map(f => botao(f.caminho, f.rotulo, true)).join('')}
    ${botao('', 'sem imagem', false)}
  </div>`;
}

   escrever a pagina inteira e clicar em salvar. O servidor continua sendo
   quem decide — isto e cortesia, nao seguranca. */
window.conferirEndereco = campo => {
  const estado = document.getElementById('enderecoEstado');
  const v = campo.value.trim().toLowerCase();
  if (!estado) return;
  if (!v) estado.textContent = 'o endereço não pode ficar em branco';
  else if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(v)) {
    estado.textContent = 'só letras sem acento, números e hífen entre palavras';
  } else if (v.length < 3 || v.length > 50) {
    estado.textContent = 'de 3 a 50 caracteres';
  } else estado.textContent = 'a página vai ficar em /eventos/' + v;
};

/* A imagem é reduzida no navegador antes de subir: uma foto de celular tem
   vários megabytes e o servidor recusa corpo acima de 256 KB. O lado maior
   vira `lado` px — o que a página realmente mostra, e nada além. */
async function reduzirImagem(arquivo, lado, qualidade) {
  const bitmap = await createImageBitmap(arquivo);
  const escala = Math.min(1, lado / Math.max(bitmap.width, bitmap.height));
  const tela = document.createElement('canvas');
  tela.width = Math.round(bitmap.width * escala);
  tela.height = Math.round(bitmap.height * escala);
  tela.getContext('2d').drawImage(bitmap, 0, 0, tela.width, tela.height);
  return tela.toDataURL('image/jpeg', qualidade);
}

let fotoNova = null;
window.carregarFoto = async entrada => {
  const arquivo = entrada.files && entrada.files[0];
  const estado = document.getElementById('fotoEstado');
  if (!arquivo) return;
  estado.textContent = 'reduzindo…';
  try {
    fotoNova = await reduzirImagem(arquivo, 360, 0.82);
    estado.textContent = `foto pronta (${Math.round(fotoNova.length / 1024)} KB) — salve para valer`;
  } catch (e) {
    fotoNova = null;
    estado.textContent = 'não consegui ler essa imagem: ' + e.message;
  }
};

/* A capa é maior que o retrato: ela ocupa a largura da tela. 1280 px cobre
   monitor comum sem estourar o corpo que o servidor aceita — e a qualidade
   cai um pouco mais porque ela vai sob um véu escuro, onde ninguém procura
   detalhe. Acima de 200 KB o salvamento falharia; por isso o aviso. */
/* Escolher uma foto da casa e o mesmo que enviar uma, do ponto de vista do
   que fica gravado: muda so o valor — um caminho curto em vez de uma imagem
   inteira dentro do banco. Por isso as duas coisas escrevem na MESMA variavel
   e a ultima acao vence, que e o que a pessoa espera de um par de campos. */
window.escolherImagem = (alvo, caminho) => {
  if (alvo === 'capa') {
    capaNova = caminho;
    const e = document.getElementById('capaEstado');
    if (e) e.textContent = caminho
      ? 'foto da casa escolhida: ' + caminho.slice(9) + ' — salve para valer'
      : 'sem imagem — o fundo “Foto” volta para a aurora';
  } else {
    fotoNova = caminho;
    const e = document.getElementById('fotoEstado');
    if (e) e.textContent = caminho
      ? 'foto da casa escolhida: ' + caminho.slice(9) + ' — salve para valer'
      : 'sem foto — o cartão fica só com o texto';
  }
  for (const b of document.querySelectorAll('#galeria-' + alvo + ' .miniatura')) {
    b.classList.toggle('escolhida', b.getAttribute('onclick').includes(`'${caminho}')`));
  }
};

let capaNova = null;
window.carregarCapa = async entrada => {
  const arquivo = entrada.files && entrada.files[0];
  const estado = document.getElementById('capaEstado');
  if (!arquivo) return;
  estado.textContent = 'reduzindo…';
  try {
    capaNova = await reduzirImagem(arquivo, 1280, 0.68);
    const kb = Math.round(capaNova.length / 1024);
    estado.textContent = kb > 200
      ? `imagem pesada (${kb} KB) — escolha uma menor, ou o salvamento vai falhar`
      : `imagem pronta (${kb} KB) — escolha o fundo “Foto” e salve`;
  } catch (e) {
    capaNova = null;
    estado.textContent = 'não consegui ler essa imagem: ' + e.message;
  }
};

function sessoesDaTela() {
  return [...document.querySelectorAll('#tabelaSessoes tr')].map(tr => {
    const v = classe => (tr.querySelector('.' + classe) || {}).value || '';
    const vagas = parseInt(v('s-vagas'), 10);
    return {
      id: Number(tr.dataset.sessao) || undefined,
      data: v('s-data'), hora: v('s-hora'), formato: v('s-formato'),
      titulo: v('s-titulo'), local: v('s-local') || null,
      vagas: Number.isFinite(vagas) && vagas > 0 ? vagas : null,
    };
  }).filter(s => s.data && s.hora);
}

/** Pede uma senha em dialogo, com os dois campos, e devolve o texto ou null.
 *  Nunca escreve a senha em lugar nenhum: nem em log, nem em URL, nem no
 *  histórico do navegador. */
function pedirSenha(titulo, minimo) {
  const dlg = document.getElementById('dlgSenha');
  const s1 = document.getElementById('senha1');
  const s2 = document.getElementById('senha2');
  const erro = document.getElementById('erroSenha');
  document.getElementById('tituloSenha').textContent = titulo;
  document.getElementById('regraSenha').textContent =
    'No mínimo ' + minimo + ' caracteres. Comprimento é o que protege: não exigimos '
    + 'símbolo nem maiúscula, porque isso produz senha curta e anotada em papel.';
  s1.value = ''; s2.value = ''; erro.textContent = '';

  return new Promise(resolve => {
    const fechar = () => {
      dlg.removeEventListener('close', aoFechar);
      resolve(dlg.returnValue === 'ok' ? s1.value : null);
      s1.value = ''; s2.value = '';
    };
    const aoFechar = () => fechar();
    const form = document.getElementById('formSenha');
    form.onsubmit = ev => {
      if (dlg.returnValue === 'cancelar') return;
      if (s1.value.length < minimo) { erro.textContent = 'Curta demais.'; ev.preventDefault(); return; }
      if (s1.value !== s2.value) { erro.textContent = 'As duas não conferem.'; ev.preventDefault(); return; }
    };
    dlg.addEventListener('close', aoFechar);
    dlg.showModal();
    s1.focus();
  });
}

      desativados, ela volta a valer: é a saída de emergência.</div>` : ''}

    <div class="filtros">
      <input type="text" id="novoUsuario" placeholder="usuario (sem espaço nem acento)">
      <input type="text" id="novoNome" placeholder="Nome de quem usa" style="min-width:190px">
      <select id="novoPapel">
        <option value="equipe">equipe</option>
        <option value="admin">administrador</option>
      </select>
      <button onclick="window.criarUsuario()">Criar usuário</button>
    </div>
    <div class="erro-senha" id="erroUsuario"></div>

    ${usuarios.length ? `<table><thead><tr><th>Usuário</th><th>Papel</th><th>Situação</th>
      <th>Último acesso</th><th>Criado</th><th></th></tr></thead>
      <tbody>${linhas}</tbody></table>`
    : '<div class="vazio">Nenhum usuário ainda. O primeiro que você criar nasce administrador.</div>'}`;
}

window.criarUsuario = async () => {
  const usuario = document.getElementById('novoUsuario').value.trim().toLowerCase();
  const nome = document.getElementById('novoNome').value.trim();
  const papelNovo = document.getElementById('novoPapel').value;
  const erro = document.getElementById('erroUsuario');
  erro.textContent = '';
  if (!usuario) { erro.textContent = 'Informe o usuário.'; return; }

  const senha = await pedirSenha('Senha de ' + usuario, 12);
  if (senha === null) return;
  let r;
  try {
    r = await fetch('/api/backoffice/usuarios', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, nome, senha, papel: papelNovo }),
    }).then(x => x.json());
  } catch (e) {
    erro.textContent = 'Não deu para falar com o servidor: ' + e.message;
    return;
  }
  if (!r.ok) { erro.textContent = r.motivo || r.erro || 'não deu'; return; }

  // Aqui está uma armadilha real, encontrada na conferência: se esta sessão
  // entrou pela senha de IMPLANTAÇÃO, criar o primeiro usuário invalida a
  // própria sessão no mesmo instante — a senha de ambiente para de abrir o
  // backoffice. Recarregar a lista tomaria 401. Então a tela para aqui e diz
  // o que fazer, em vez de deixar um erro de rede sem explicação.
  if (porImplantacao) {
    conteudo.innerHTML = `
      <h2 style="margin:0 0 10px;font-size:var(--t-titulo);font-weight:400">Usuário
      <b>${esc(usuario)}</b> criado como administrador</h2>
      <p class="nota" style="max-width:70ch">A partir de agora <b>a senha de implantação não
      abre mais esta tela</b> — é assim de propósito: enquanto houver usuário ativo, só vale
      usuário e senha próprios, e é isso que faz a auditoria significar alguma coisa.</p>
      <p class="nota" style="max-width:70ch"><b>Feche esta aba e abra o backoffice de novo</b>,
      entrando como <code>${esc(usuario)}</code>. O navegador guarda a credencial antiga
      enquanto a aba estiver aberta.</p>
      <p class="nota" style="max-width:70ch">Se um dia todos os usuários forem desativados, a
      senha de implantação volta a valer. É a saída de emergência, e não exige mexer no banco.</p>`;
    return;
  }
  verUsuarios();
};

async function alterar(usuario, mudanca, titulo) {
  let r;
  try {
    r = await fetch('/api/backoffice/usuarios/alterar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario, ...mudanca }),
    }).then(x => x.json());
  } catch (e) {
    alert((titulo ? titulo + ': ' : '') + 'não deu para falar com o servidor (' + e.message + ')');
    return false;
  }
  if (!r.ok) alert((titulo ? titulo + ': ' : '') + (r.motivo || r.erro || 'não deu'));
  return r.ok;
}

window.trocarSenhaDe = async usuario => {
  const senha = await pedirSenha('Nova senha de ' + usuario, 12);
  if (senha === null) return;
  if (await alterar(usuario, { senha }, 'Trocar senha')) verUsuarios();
};

window.alternarPapel = async (usuario, para) => {
  if (await alterar(usuario, { papel: para }, 'Mudar papel')) verUsuarios();
};

window.alternarAtivo = async (usuario, para) => {
  if (await alterar(usuario, { ativo: para }, 'Mudar situação')) verUsuarios();
};

/** Autoatendimento: qualquer pessoa troca a própria senha, inclusive quem não
 *  administra. Sem isso, trocar senha viraria pedido a outra pessoa — e senha
 *  que passa pela mão de terceiro deixa de ser senha. */
window.trocarMinhaSenha = async () => {
  if (porImplantacao) {
    alert('Você entrou com a senha de implantação, que não é de usuário. '
      + 'Crie o seu usuário na aba Usuários.');
    return;
  }
  const senha = await pedirSenha('Nova senha de ' + quem, 12);
  if (senha === null) return;
  if (await alterar(quem, { senha }, 'Trocar minha senha')) {
    alert('Senha trocada. O navegador ainda guarda a antiga nesta aba: '
      + 'feche e abra de novo para entrar com a nova.');
  }
};

// ---------------------------------------------------------------------- abas
document.querySelectorAll('.aba').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.aba').forEach(x => x.classList.toggle('ativa', x === b));
  abaAtual = b.dataset.aba;
  desenhar();
}));

function desenhar() {
  conteudo.innerHTML = 'carregando…';
  const fn = { respostas: verRespostas, adesoes: verAdesoes, eventosAgenda: verAgenda,
               convites: verConvites, eventos: verEventos, usuarios: verUsuarios }[abaAtual];
  fn().catch(e => { conteudo.innerHTML = `<div class="vazio">Falha ao carregar: ${esc(e.message)}</div>`; });
}

// Quem nao administra nao ve a aba de usuarios — e o servidor recusa a rota
// de todo modo: esconder e conforto de tela, nao controle de acesso.
if (ehAdmin) document.getElementById('abaUsuarios').classList.remove('oculta');
if (porImplantacao) { abaAtual = 'usuarios';
  document.querySelectorAll('.aba').forEach(x =>
    x.classList.toggle('ativa', x.dataset.aba === 'usuarios')); }

desenhar();
</script>
</body>
