<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23FFFFFF'/><g transform='translate%28-31.964 -46.368%29 scale%280.32799%29' fill='%23052C47'><path d='M146.25%2C220.25l-9%2C9a39.85%2C39.85%2C0%2C0%2C1-5.53-1.72L146.26%2C213l3.63%2C3.64.56.57%2C10.37%2C10.37a38.67%2C38.67%2C0%2C0%2C1-5.54%2C1.72Z'/><path d='M124%2C223.47a39.46%2C39.46%2C0%2C0%2C1-4.08-3.18l22.73-22.74h0l3.64-3.64%2C3.63%2C3.64.56.57%2C22.17%2C22.17a40.56%2C40.56%2C0%2C0%2C1-4.08%2C3.18l-22.28-22.29Z'/><path d='M146.25%2C182.1l-32%2C32a37.62%2C37.62%2C0%2C0%2C1-2.34-3.6c-.26-.44-.52-.89-.76-1.35a40.44%2C40.44%2C0%2C0%2C1-1.9-4.19h6.88l8.35-8.34H107.05a40.85%2C40.85%2C0%2C0%2C1-.45-5.15h23l8.34-8.34H107.32a38.85%2C38.85%2C0%2C0%2C1%2C1.36-5.14h34.44l3.14-3.14L149.4%2C178h34.44a38.82%2C38.82%2C0%2C0%2C1%2C1.35%2C5.14H154.53l8.34%2C8.34h23a39.19%2C39.19%2C0%2C0%2C1-.44%2C5.15H168l8.34%2C8.34h6.9a38.66%2C38.66%2C0%2C0%2C1-1.91%2C4.2c-.24.45-.49.9-.75%2C1.34a39.9%2C39.9%2C0%2C0%2C1-2.35%2C3.61Z'/><path d='M112.64%2C169.63a39.43%2C39.43%2C0%2C0%2C1%2C3.83-5.14h59.58a39.43%2C39.43%2C0%2C0%2C1%2C3.83%2C5.14Z'/><path d='M126.72%2C156.15a39.63%2C39.63%2C0%2C0%2C1%2C39.07%2C0Z'/></g></svg>">
<title>Entrar — Conferência do Diagnóstico</title>
<style>
/* Tela de entrada do backoffice.
   Existe porque autenticação HTTP não tem tela: a caixa é do navegador, não
   tem botão de sair, guarda a credencial na aba e, quando alguém troca a
   própria senha, obriga a fechar tudo. Com usuários e papéis isso deixou de
   servir. Aqui os campos são da página, e há como sair. */
:root{
  --escuro:#052C47; --claro:#71CFEB; --fundo:#f4f7f9; --tinta:#123;
  --cinza:#5b6b78; --borda:#e3e9ee; --borda-forte:#cfd8df;
  --sombra:0 1px 3px rgba(5,44,71,.08);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--fundo);color:var(--tinta);padding:24px;
  font-family:Kanit,Montserrat,Raleway,Arial,sans-serif;font-weight:300;line-height:1.55}
.caixa{background:#fff;border:1px solid var(--borda);border-radius:12px;
  box-shadow:var(--sombra);padding:34px 32px;width:100%;max-width:400px}
h1{font-size:21px;font-weight:400;margin:0 0 6px;color:var(--escuro)}
p.nota{font-size:13px;color:var(--cinza);margin:0 0 22px;line-height:1.6}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.9px;
  color:var(--cinza);margin-bottom:6px}
input{display:block;width:100%;padding:12px 14px;margin-bottom:16px;font:inherit;
  border:1px solid var(--borda-forte);border-radius:8px;background:#fff}
input:focus{outline:2px solid var(--claro);outline-offset:1px;border-color:var(--claro)}
button{width:100%;padding:13px 18px;font:inherit;font-weight:500;cursor:pointer;
  background:var(--escuro);color:#fff;border:1px solid var(--escuro);border-radius:8px}
button:hover{background:#0a3d60}
.erro{background:#fdf0f0;border:1px solid #f0c4c4;color:#8d2226;border-radius:8px;
  padding:11px 14px;font-size:13px;margin:0 0 18px;line-height:1.5}
.primeiro{background:#fdf9f0;border:1px solid #f0dcb4;color:#6a4a00;border-radius:8px;
  padding:12px 14px;font-size:12.5px;margin:0 0 18px;line-height:1.55}
.marca{display:flex;align-items:center;gap:9px;margin-bottom:20px}
.marca .sinal{width:26px;height:26px;border-radius:6px;background:var(--escuro);
  display:flex;align-items:center;justify-content:center;flex:0 0 26px}
.marca .sinal svg{display:block}
.marca span{font-size:12px;text-transform:uppercase;letter-spacing:1.1px;color:var(--cinza)}
</style>
</head>
<body>
<form class="caixa" method="POST" action="/entrar" autocomplete="on">
  <div class="marca">
    <div class="sinal"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M8 21l8-11 8 11" stroke="#71CFEB" stroke-width="3" fill="none"/></svg></div>
    <span>auster · uso interno</span>
  </div>

  <h1>Conferência do Diagnóstico</h1>
  <p class="nota">Entre com o seu usuário e a sua senha. É esse nome que fica gravado
  na auditoria de cada resposta que você validar.</p>

  <!--__AVISO__-->

  <label for="usuario">Usuário</label>
  <input type="text" id="usuario" name="usuario" autocomplete="username"
         autocapitalize="none" spellcheck="false" required autofocus>

  <label for="senha">Senha</label>
  <input type="password" id="senha" name="senha" autocomplete="current-password" required>

  <button type="submit">Entrar</button>
</form>
</body>
</html>
