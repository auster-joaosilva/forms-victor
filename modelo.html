<style>
:root{
  /* Marca */
  --escuro:#052C47; --claro:#71CFEB; --branco:#fff;
  /* #71CFEB tem 1,78:1 sobre branco — inutilizável como texto ou contorno.
     O acento sobre fundo claro é a mesma família de matiz, escurecida até
     passar de 4,5:1. Decisão já validada no painel fiscal da casa. */
  --acento:#007E99;
  --tinta:#052C47; --cinza:#5b6b78; --fundo:#f1f5f8;
  /* Borda em DUAS camadas: divisória discreta e contorno de controle.
     A WCAG 1.4.11 exige 3:1 só para fronteira de controle. Escurecer tudo
     a 3:1 deixa a tela pesada; deixar tudo em 1,28:1 apaga os objetos. */
  --borda:#cfd9e0;        /* ~1,6:1  — divisória */
  --borda-forte:#8496a5;  /* 3,05:1 — contorno de campo e de opção (WCAG 1.4.11) */
  --sombra:0 1px 2px rgba(5,44,71,.06), 0 4px 12px rgba(5,44,71,.05);
  --alto:#b63b32; --medio:#9a6608; --baixo:#2f7d52;
  /* Escala tipográfica com degraus reais: 12 · 14 · 16 · 20 · 28.
     Antes havia quatro tamanhos entre 11 e 14 px — sem hierarquia. */
  --t-meta:12px; --t-corpo:14px; --t-destaque:16px; --t-titulo:20px; --t-tela:28px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);
  font-family:Kanit,Montserrat,Raleway,Arial,sans-serif;font-weight:300;line-height:1.55}
header{background:var(--escuro);color:#fff;padding:30px 24px 26px;box-shadow:var(--sombra);text-align:center}
header .cabecalho{display:flex;justify-content:center;align-items:center}
header .logo{height:52px;width:auto;display:block}
header .logo.papel{display:none}
header .sub{color:var(--claro);font-size:13.5px;margin-top:14px;line-height:1.5;
  max-width:60ch;margin-left:auto;margin-right:auto}
@media (max-width: 560px){
  header{padding:24px 16px 20px}
  header .logo{height:42px}
}
main{max-width:820px;margin:0 auto;padding:28px 24px 48px}
.etapa-conta{color:var(--cinza);font-size:var(--t-meta);margin:0 0 26px;
  text-transform:uppercase;letter-spacing:.8px}
.passos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.passo{flex:1 1 90px;font-size:var(--t-meta);text-align:center;padding:10px 6px;border-radius:6px;
  background:#fff;border:1px solid var(--borda);color:var(--cinza);cursor:pointer;
  transition:border-color .15s,color .15s}
.passo:hover{border-color:var(--borda-forte);color:var(--tinta)}
.passo.ativo{background:var(--escuro);color:#fff;border-color:var(--escuro)}
.passo.feito{border-color:var(--acento);color:var(--acento);background:#f2fafc}
.cartao{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:30px 32px;box-shadow:var(--sombra)}
h1{font-weight:300;font-size:var(--t-tela);margin:0 0 2px;letter-spacing:-.2px;line-height:1.2}
h2{font-weight:500;font-size:var(--t-titulo);margin:0 0 18px}
h3{font-weight:500;font-size:var(--t-destaque);margin:28px 0 12px;color:var(--escuro);
  padding-bottom:8px;border-bottom:2px solid var(--borda)}
.campo{margin-bottom:26px}
.campo>label{display:block;font-weight:500;font-size:var(--t-corpo);margin-bottom:8px;
  line-height:1.4}
.obr{color:var(--alto)}
.opcoes{display:flex;flex-direction:column;gap:7px}
.opcoes.curtas{flex-direction:row;flex-wrap:wrap}
.opcoes.curtas .opcao{flex:0 1 auto;min-width:118px}
.opcao{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--borda-forte);
  border-radius:8px;cursor:pointer;font-size:var(--t-corpo);background:#fff;
  transition:border-color .12s,background .12s,box-shadow .12s}
.opcao:hover{border-color:var(--acento);background:#f7fcfd}
.opcao.marcada{border-color:var(--acento);background:#eef8fb;box-shadow:inset 0 0 0 1px var(--acento)}
.opcao input{accent-color:var(--escuro);margin:0}
textarea,input[type=text],input[type=email],input[type=tel],select{width:100%;padding:11px 13px;
  border:1px solid var(--borda-forte);border-radius:8px;font-family:inherit;
  font-size:var(--t-corpo);font-weight:300;background:#fff;color:var(--tinta);
  transition:border-color .12s,box-shadow .12s}
textarea{resize:vertical;min-height:76px;line-height:1.55}
textarea:focus,input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus,select:focus{
  outline:none;border-color:var(--acento);box-shadow:0 0 0 3px rgba(0,126,153,.16)}
/* 7 colunas nao cabem em tela de telefone: a tabela rola dentro do proprio
   quadro, e a coluna do rotulo fica presa a esquerda. */
.matriz-rolo{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.matriz{width:100%;min-width:430px;border-collapse:collapse;font-size:12.5px}
table.matriz th{font-weight:500;color:var(--tinta);padding:9px 4px;text-align:center;font-size:var(--t-meta)}
table.matriz td{padding:9px 4px;text-align:center;border-top:1px solid var(--borda)}
table.matriz td:first-child{text-align:left;font-size:var(--t-corpo)}
table.matriz tbody tr:hover{background:#f7fafc}
table.matriz input{accent-color:var(--acento);width:17px;height:17px}
table.matriz .na{border-left:1px solid var(--borda-forte);color:var(--cinza)}
.soma{font-size:12.5px;color:var(--cinza);margin-top:8px}
.soma.alerta{color:var(--medio)}
.rodape-nav{display:flex;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--borda)}
button{font-family:inherit;font-size:var(--t-corpo);font-weight:500;padding:12px 28px;
  border-radius:8px;border:1px solid var(--escuro);cursor:pointer;transition:background .12s,box-shadow .12s}
button.principal:hover{background:#0a3d5f;box-shadow:var(--sombra)}
button.secundario:hover{background:#f1f5f8}
button.principal{background:var(--escuro);color:#fff}
button.secundario{background:#fff;color:var(--escuro)}
button:disabled{opacity:.35;cursor:default}
.erro{color:var(--alto);font-size:var(--t-meta);margin-top:6px;font-weight:400}
.dica{font-size:var(--t-meta);color:var(--cinza);margin:-2px 0 10px;line-height:1.5}
.cadastro{font-size:var(--t-meta);margin-top:7px;padding:9px 12px;border-radius:7px;line-height:1.5}
.cadastro.buscando{background:#f1f5f8;color:var(--cinza)}
.cadastro.achou{background:#eef8fb;border:1px solid var(--acento);color:var(--tinta)}
.cadastro.alerta{background:#fdf4e3;border:1px solid #e8cf9a;color:#7a5200}
.cadastro.mudo{display:none}
.cadastro b{font-weight:500}
.opcao.com-desc{align-items:flex-start}
.opcao .texto-opcao{display:flex;flex-direction:column;gap:2px}
.opcao .texto-opcao b{font-weight:400}
.opcao .desc{font-size:var(--t-meta);color:var(--cinza);line-height:1.5}
/* resultado */
.selo{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11.5px;font-weight:400}
.selo.ALTA{background:#fdeceb;color:var(--alto)} .selo.MÉDIA{background:#fdf4e3;color:var(--medio)}
.selo.BAIXA{background:#eaf5ee;color:var(--baixo)}
.saida{background:var(--escuro);color:#fff;border-radius:10px;padding:30px 32px;margin-bottom:20px;box-shadow:var(--sombra)}
.saida .codigo{color:var(--claro);font-size:12px;letter-spacing:1.5px}
.saida h2{color:#fff;font-size:var(--t-tela);font-weight:300;margin:8px 0 12px;letter-spacing:-.2px}
.saida p{margin:0;color:#cfe3ee;font-size:var(--t-destaque);line-height:1.6;max-width:62ch}
/* A DECISÃO — heroi da tela. Um cartao so: antes havia dois titulos grandes
   competindo (a faixa de regime e o cartao escuro da saida). */
.regime{background:var(--escuro);color:#fff;border-radius:12px;padding:38px 40px 34px;
  margin-bottom:16px;box-shadow:0 10px 28px rgba(5,44,71,.22);
  border-top:7px solid var(--claro)}
/* A cor segue a CERTEZA, não a família. Decisão fechada ganha a cor do caminho;
   decisão aberta é sempre âmbar, inclusive quando o caminho já tem nome. */
.regime.fechada.f-hibrido{border-top-color:var(--claro)}
.regime.fechada.f-padrao{border-top-color:#4fbf85}
.regime.aberta{border-top-color:#f0b64a}
.regime .rot{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:var(--claro);
  font-weight:400}
.regime .nome{font-size:clamp(32px,5.4vw,46px);font-weight:300;letter-spacing:-1px;color:#fff;
  margin:10px 0 0;line-height:1.08}
.regime .qual{display:inline-block;margin-top:14px;padding:6px 15px;border-radius:20px;
  font-size:13px;background:rgba(113,207,235,.18);color:var(--claro);
  border:1px solid rgba(113,207,235,.45)}
.regime.aberta .qual{background:rgba(240,182,74,.16);color:#f5c97a;
  border-color:rgba(240,182,74,.45)}
.regime.aberta .rot{color:#f5c97a}
.regime .faca{margin:22px 0 0;font-size:19px;font-weight:400;line-height:1.5;max-width:60ch;color:#fff}
.regime .porque{margin:20px 0 0;padding-top:17px;border-top:1px solid rgba(113,207,235,.3);
  font-size:var(--t-corpo);line-height:1.6;max-width:70ch;color:#cfe3ee}
.regime .porque b{font-weight:400;color:#fff}
.regime .porque .prefixo{color:var(--claro);font-size:var(--t-meta);text-transform:uppercase;
  letter-spacing:.8px}
.regime .abertos{margin-top:18px;padding:14px 16px;border-radius:8px;
  background:rgba(240,182,74,.12);border:1px solid rgba(240,182,74,.35)}
.regime .abertos .t{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:#f5c97a}
.regime .abertos ul{margin:9px 0 0;padding-left:19px;color:#e4eef4;font-size:var(--t-corpo);
  line-height:1.6;max-width:66ch}
.regime .abertos li{margin-bottom:4px}
.regime .det{margin:8px 0 0;font-size:var(--t-corpo);line-height:1.6;max-width:70ch;color:#a8cbdd}
.regime .prelim{margin:12px 0 0;font-size:var(--t-corpo);line-height:1.6;max-width:70ch;color:#a8cbdd}
.regime .prelim b{font-weight:400;color:#fff}
.regime .trava{margin:20px 0 0;font-size:13px;line-height:1.6;max-width:70ch;color:#2b1d00;
  background:var(--claro);border-radius:8px;padding:14px 16px}
.regime .trava b{font-weight:500}
.regime .trava .fonte{display:block;margin-top:5px;font-size:11.5px;color:#0d4457}

/* Aviso de que o diagnostico de verdade depende dos numeros. */
.precisa-numeros{display:flex;gap:14px;align-items:flex-start;background:#fff;
  border:1px solid var(--borda-forte);border-left:4px solid var(--escuro);border-radius:9px;
  padding:17px 20px;margin-bottom:20px;box-shadow:var(--sombra)}
.precisa-numeros .marca{font-size:20px;line-height:1}
.precisa-numeros p{margin:0;font-size:var(--t-corpo);line-height:1.6;max-width:74ch}
.precisa-numeros b{font-weight:500}
/* Conferência */
.rev-bloco{margin-bottom:26px}
.rev-bloco h3{font-size:var(--t-corpo);font-weight:500;color:var(--escuro);margin:0 0 4px;
  text-transform:uppercase;letter-spacing:.8px}
.rev-bloco .conta{font-size:var(--t-meta);color:var(--cinza);margin:0 0 12px}
.rev-linha{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-top:1px solid var(--borda)}
.rev-linha:last-child{border-bottom:1px solid var(--borda)}
.rev-linha .pergunta{flex:1 1 52%;font-size:var(--t-corpo);color:var(--cinza);line-height:1.5}
.rev-linha .resposta{flex:1 1 40%;font-size:var(--t-corpo);color:var(--tinta);font-weight:500;line-height:1.5}
.rev-linha .resposta .sub{display:block;font-weight:300;color:var(--cinza);font-size:var(--t-meta)}
.rev-linha .linha-matriz{display:block;font-weight:300;color:var(--cinza);font-size:var(--t-meta);
  line-height:1.65}
.rev-linha .linha-matriz b{font-weight:500;color:var(--tinta)}
.rev-linha .linha-matriz.na b{color:#7a5200}
.rev-linha .resposta.vazia{font-weight:300;color:#8496a5;font-style:italic}
.rev-linha .resposta.lacuna{color:#7a5200}
.rev-linha button.alterar{flex:0 0 auto;background:none;border:0;padding:2px 4px;color:var(--acento);
  font-size:var(--t-meta);font-weight:500;cursor:pointer;text-decoration:underline}
.rev-linha button.alterar:hover{color:var(--escuro)}
.rev-linha .decide{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:10px;
  font-size:10.5px;font-weight:400;background:#eef3f6;color:var(--cinza);vertical-align:1px}
.rev-aviso{background:#fdf4e3;border:1px solid #f0dcb4;border-radius:8px;padding:14px 16px;
  font-size:var(--t-corpo);line-height:1.6;margin:0 0 24px;max-width:74ch}
.campo.destacado{animation:pisca 1.8s ease-out}
@keyframes pisca{0%,100%{background:transparent}18%{background:#eef8fb}}
.rev-aviso ul{margin:9px 0 0;padding-left:20px}
.rev-aviso li{margin-bottom:3px}
.bloco-envio{border-left:3px solid var(--escuro)}
.bloco-envio h2{font-family:inherit;letter-spacing:.5px}
.envio{font-size:var(--t-corpo);line-height:1.6;max-width:70ch;color:var(--cinza);margin:0 0 16px}
.envio b{font-weight:500;color:var(--tinta)}
.envio.ok{color:var(--baixo)}
.envio.ok b{color:var(--baixo)}
.envio.erro{color:var(--alto)}
.envio.erro b{color:var(--alto)}
.privacidade{border:1px solid var(--borda);border-radius:8px;padding:14px 16px;margin:0 0 12px;
  background:#fafcfd;font-size:var(--t-meta);line-height:1.6;color:var(--cinza);max-width:76ch}
.privacidade p{margin:0 0 7px}
.privacidade p:last-child{margin-bottom:0}
.privacidade b{font-weight:500;color:var(--tinta)}
.privacidade a{color:var(--acento)}
.opcao.aceite{align-items:flex-start}
.opcao.aceite input{margin-top:2px;accent-color:var(--acento);width:17px;height:17px}
.opcao.aceite .texto-opcao b{font-weight:400;line-height:1.5}
.retomar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:#fff;border:1px solid var(--acento);border-left:4px solid var(--acento);
  border-radius:9px;padding:15px 18px;margin-bottom:18px;box-shadow:var(--sombra);
  font-size:var(--t-corpo);line-height:1.55}
.retomar b{font-weight:500;display:block}
.retomar span{color:var(--cinza);font-size:var(--t-meta)}
.retomar .botoes{display:flex;gap:9px;flex-wrap:wrap}
.retomar button{padding:9px 18px;font-size:var(--t-meta)}
.escopo{background:#eef8fb;border:1px solid var(--acento);border-radius:8px;padding:12px 14px;
  font-size:var(--t-corpo);line-height:1.55;color:var(--tinta);margin:0 0 22px;max-width:74ch}
/* Encaminhamento: quem nao e optante nao preenche 5 blocos para ouvir "nao e pra voce". */
.encaminha{background:#fff;border:1px solid var(--borda);border-top:7px solid var(--claro);
  border-radius:12px;padding:34px 36px;box-shadow:var(--sombra)}
.encaminha h1{margin:0 0 12px;font-size:var(--t-tela);font-weight:300;color:var(--escuro)}
.encaminha p{font-size:var(--t-destaque);line-height:1.6;max-width:68ch;color:var(--tinta);margin:0 0 14px}
.encaminha p.menor{font-size:var(--t-corpo);color:var(--cinza)}
.encaminha .botoes{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;align-items:center}
.encaminha a.cta{display:inline-block;background:var(--escuro);color:#fff;text-decoration:none;
  font-size:var(--t-corpo);font-weight:500;padding:13px 26px;border-radius:8px;
  border:1px solid var(--escuro);transition:background .12s}
.encaminha a.cta:hover{background:#0a3d5f}
.encaixe{margin-top:22px;padding-top:20px;border-top:1px solid var(--acento)}
.encaixe .t{font-size:var(--t-destaque);font-weight:500;color:var(--escuro)}
.encaixe p{font-size:var(--t-corpo);color:var(--cinza);line-height:1.6;max-width:70ch;margin:8px 0 16px}
.encaixe a.cta{display:inline-block;background:var(--escuro);color:#fff;text-decoration:none;
  font-size:var(--t-corpo);font-weight:500;padding:12px 24px;border-radius:8px;
  border:1px solid var(--escuro);transition:background .12s}
.encaixe a.cta:hover{background:#0a3d5f}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.mini{background:#fff;border:1px solid var(--borda);border-radius:9px;padding:17px;box-shadow:var(--sombra)}
.mini .rot{font-size:var(--t-meta);color:var(--cinza);text-transform:uppercase;letter-spacing:.6px}
.mini .val{font-size:17px;font-weight:500;margin-top:5px}
.mini .nota-mini{font-size:11.5px;color:var(--cinza);line-height:1.5;margin-top:7px}
.mini .nota-mini b{font-weight:500;color:var(--tinta)}

/* Impressão. O botão "Imprimir" existe desde a primeira versão e sai com trilha
   de etapas, botões e sombras — o cliente imprime ou salva em PDF para levar à
   conversa, e o que interessa é o conteúdo. */
@media print {
  /* Margem de documento, não de página web: 12 mm deixava a caixa de cada ação
     encostando na borda do papel. 20 mm nas laterais dá 170 mm de largura útil
     no A4, que é medida de leitura, e sobra bastante para grampo ou encadernação. */
  @page { margin: 10mm; }
  body{background:#fff;font-size:11pt}
  header{box-shadow:none;padding:0 0 10mm;background:#fff}
  header .logo.tela{display:none}
  header .logo.papel{display:block;margin:0 auto}
  header .sub{color:var(--escuro)}

  .grade{grid-template-columns:repeat(4,1fr)}
  h1,h2,h3{break-after:avoid;page-break-after:avoid}
  a{color:var(--escuro);text-decoration:none}
  .ressalva,.notas-pe{border-top:1px solid #bbb}
}

/* Tela de telefone. O arquivo nao tinha nenhuma consulta de midia: em 400 px,
   24 px de main + 40 px do cartao deixavam 272 px de texto. */

<body>
<header>
  <div class="cabecalho">
    <!-- Logo oficial: espelho local do Drive de marca >
         Auster\Inteligencia Contabil\Logo_Negativa_Compl_sf.png (tela)
         Auster\Inteligencia Contabil\Logo_Positiva_Compl.png (papel)
         Recortado pelo canal ALFA (o RGB sob o alfa é preto) e reduzido a 84 px de
         altura, embutido em data URI para o arquivo seguir único.
         É a marca da Inteligencia CONTABIL: a decisão de setembro é obrigação
         recorrente da carteira. As frentes de consultoria no relatório são
         atribuídas à Inteligencia Tributaria, no próprio texto. -->
    <!-- Duas versoes da mesma marca, porque o fundo muda de suporte:
         .tela   = negativa, sobre o cabecalho azul escuro;
         .papel  = positiva, sobre o branco da folha.
         Antes havia so a negativa e a impressao a invertia por filtro CSS.
         invert(1) leva o branco a preto, mas leva tambem o azul-claro
         #70CEEC da marca a #8F3113, um marrom que nao esta na paleta.
         O base64 das duas mora em ativos/ e entra no build pelo marcador. -->
    <img class="logo tela" alt="auster Inteligência Contábil"
         src="data:image/png;base64,/*__LOGO_TELA__*/">
    <img class="logo papel" alt="auster Inteligência Contábil"
         src="data:image/png;base64,/*__LOGO_PAPEL__*/">
  </div>
  <div class="sub">Diagnóstico — Simples padrão ou regime regular de IBS e CBS</div>
</header>
<main id="app"></main>

<script type="module">
/*__MODULOS__*/

// ---------------------------------------------------------------- estado
const R = {};
/* ====================================================================
 * CONFIGURAÇÃO DE PUBLICAÇÃO — tudo o que muda ao pôr no ar fica aqui.
 * Campo vazio DESLIGA o recurso em vez de inventar destino.
 * ==================================================================== */
const CONFIG = {
  // Para onde as respostas são enviadas (POST JSON). Vazio = nada é enviado.
  endpointEnvio: '',
  // Alternativa sem servidor: número de WhatsApp da casa, só dígitos com país.
  whatsapp: '',
  // Canal de privacidade exigido pela LGPD, art. 18.
  emailPrivacidade: 'contato@austercontabil.com.br',
  // Quem controla os dados, para o aviso de privacidade.
  controlador: 'Auster Inteligência Contábil',
  // Meses de guarda declarados ao respondente.
  guardaMeses: 24,
};

/* O servidor injeta aqui o endpoint de envio, o convite e o pré-preenchimento.
 * Aberto por duplo clique, nada é injetado e o arquivo segue funcionando com os
 * campos vazios — um HTML só, sem servidor, continua sendo um modo de uso. */
/*__PUBLICACAO__*/

const CONVITE = typeof window !== 'undefined' ? (window.__CONVITE__ || null) : null;

/** Data de referencia do diagnostico.
 *
 *  Vem do SERVIDOR quando a pagina e servida. Relogio errado no computador de
 *  quem responde mudaria a contagem de uma janela legal — e computador com data
 *  errada nao e raro. Sem servidor (arquivo aberto por duplo clique), cai no
 *  relogio local, que e o unico que existe ali. */
function agora() {
  const doServidor = typeof window !== 'undefined' ? window.__HOJE__ : null;
  if (doServidor) {
    const d = new Date(doServidor);
    if (!isNaN(d)) return d;
  }
  return new Date();
}

let etapa = 1;
const TOTAL = BLOCOS.length;
// Entre o formulário e o resultado entra uma tela de conferência. Vale sobretudo
// pela matriz e pelos "não sei": um clique errado ali muda a recomendação, e
// depois do resultado ninguém volta procurar o que foi.
const REVISAO = TOTAL + 1;
const RESULTADO = TOTAL + 2;
// Visão de documento: o mesmo conteúdo do resultado, montado para o papel e
// para o PDF, com quebras de página onde elas não cortam um enquadramento.
const RELATORIO = TOTAL + 3;
const app = document.getElementById('app');
const erros = {};

/** Painel de depuração do motor. NUNCA aparece para quem preenche: só com
 *  ?motor=1 na URL, para conferência interna da Auster. */
const MOSTRAR_PAINEL_DO_MOTOR = (() => {
  try { return new URLSearchParams(location.search).get('motor') === '1'; }
  catch { return false; }
})();

/* Escapa tambem o apostrofo: atributo em aspas simples e lugar legitimo no
   codigo, e sem isto um nome de empresa com ' escaparia do atributo. */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** Devolve {chave: mensagem} dos problemas da etapa. Vazio = pode avançar. */
function problemasNaEtapa(numeroBloco) {
  const problemas = {};
  for (const p of perguntasVisiveis(R)) {
    if (p.bloco !== numeroBloco || p.obrigatoria === 'nunca') continue;
    const v = R[p.chave];
    if (p.tipo === 'matriz') {
      const m = v || {};
      if (p.linhas.some(l => !m[l.chave])) problemas[p.chave] = 'Responda todas as linhas.';
      continue;
    }
    if (!v || !String(v).trim()) { problemas[p.chave] = 'Obrigatório'; continue; }
    if (p.validador && !p.validador.valida(v)) problemas[p.chave] = p.validador.erro;
  }
  return problemas;
}

/** Soma dos pontos médios das linhas respondidas com faixa, e quantas linhas
 *  ficaram em "não sei". A lacuna não entra na soma como 0% — entra como lacuna,
 *  senão o aviso de "revise, deveria dar 100%" acusaria de erro quem foi honesto. */
function somaMatriz(chave) {
  const m = R[chave] || {};
  let soma = 0, semDado = 0;
  for (const v of Object.values(m)) {
    const pm = pontoMedioFaixa(v);
    if (pm === null) semDado++; else soma += pm;
  }
  return { soma, semDado };
}

/** Texto e classe do rodapé da matriz. Uma função só, usada no desenho e na
 *  atualização ao clicar — para as duas nunca divergirem. */
function rodapeMatriz(chave) {
  const { soma, semDado } = somaMatriz(chave);
  if (semDado) {
    return { classe: '', texto: `Soma das linhas respondidas: ${soma}%` +
      ` — ${semDado === 1 ? 'uma linha ficou' : semDado + ' linhas ficaram'} em "não sei".` };
  }
  const fora = soma > 0 && (soma < 80 || soma > 120);
  return { classe: fora ? 'alerta' : '',
           texto: `Soma aproximada: ${soma}%` +
             (fora ? ' — revise, o total deveria ficar perto de 100%.' : '') };
}

// ---------------------------------------------------------------- render
function campo(p) {
  const err = erros[p.chave] ? `<div class="erro">${esc(erros[p.chave])}</div>` : '';
  const marca = p.obrigatoria !== 'nunca' ? ' <span class="obr">*</span>' : '';
  const textoDica = typeof p.dica === 'function' ? p.dica(R) : p.dica;
  const dica = textoDica ? `<div class="dica">${esc(textoDica)}</div>` : '';

  if (p.tipo === 'matriz') {
    const cols = p.colunas.map(c => `<th class="${c.valor === p.naoSei ? 'na' : ''}">${esc(c.rotulo)}</th>`).join('');
    const rows = p.linhas.map(l => `<tr><td>${esc(l.rotulo)}</td>` + p.colunas.map(c => {
      const sel = (R[p.chave] || {})[l.chave] === c.valor ? 'checked' : '';
      return `<td class="${c.valor === p.naoSei ? 'na' : ''}"><input type="radio" name="${p.chave}__${l.chave}" value="${c.valor}" ${sel}
        onchange="window.setMatriz('${p.chave}','${l.chave}',this.value)"></td>`;
    }).join('') + '</tr>').join('');
    const rod = rodapeMatriz(p.chave);
    return `<div class="campo" data-campo="${p.chave}"><label>${esc(p.enunciado)}${marca}</label>${dica}
      <div class="matriz-rolo"><table class="matriz"><thead><tr><th></th>${cols}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="soma ${rod.classe}">${esc(rod.texto)}</div>
      ${err}</div>`;
  }

  if (p.tipo === 'consentimento') {
    const marcado = R[p.chave] === 'sim';
    return `<div class="campo" data-campo="${p.chave}"><label>${esc(p.enunciado)}${marca}</label>
      <div class="privacidade">
        <p><b>Para que servem:</b> montar este diagnóstico e permitir que a equipe da
        ${esc(CONFIG.controlador)} fale com você sobre ele. Não usamos para mais nada e não
        compartilhamos com terceiros.</p>
        <p><b>Quando são enviadas:</b> ao terminar o preenchimento, automaticamente. Você recebe
        um número de protocolo na tela e pode baixar o plano de ação em PDF.</p>
        <p><b>O que é coletado:</b> CNPJ, nome da empresa, nome de quem responde, e-mail,
        telefone e as respostas do formulário. O CNPJ é consultado na base pública da Receita
        para poupar digitação.</p>
        <p><b>Por quanto tempo:</b> ${CONFIG.guardaMeses} meses, contados do envio.</p>
        <p><b>Seus direitos:</b> pedir acesso, correção ou exclusão a qualquer momento, em
        <a href="mailto:${esc(CONFIG.emailPrivacidade)}">${esc(CONFIG.emailPrivacidade)}</a>
        (LGPD, art. 18).</p>
      </div>
      <label class="opcao aceite ${marcado ? 'marcada' : ''}">
        <input type="checkbox" ${marcado ? 'checked' : ''}
          onchange="window.set('${p.chave}', this.checked ? 'sim' : '')">
        <span class="texto-opcao"><b>${esc(p.rotuloAceite)}</b></span>
      </label>${err}</div>`;
  }

  if (p.tipo === 'textarea') {
    return `<div class="campo" data-campo="${p.chave}"><label>${esc(p.enunciado)}${marca}</label>${dica}
      <textarea rows="3" oninput="window.setTexto('${p.chave}',this)"
        placeholder="Opcional">${esc(R[p.chave] || '')}</textarea>${err}</div>`;
  }

  if (['texto', 'email', 'cnpj', 'telefone'].includes(p.tipo)) {
    // Texto NUNCA redesenha durante a digitação: o innerHTML recria o campo e
    // o foco se perde a cada tecla. Nenhuma condicional depende de texto.
    const modo = p.tipo === 'email' ? 'email' : p.tipo === 'telefone' ? 'tel' : 'text';
    const selo = p.chave === 'cnpj' ? seloCadastro() : '';
    return `<div class="campo" data-campo="${p.chave}"><label>${esc(p.enunciado)}${marca}</label>${dica}
      <input type="${modo}" inputmode="${p.tipo === 'telefone' ? 'numeric' : 'text'}"
        value="${esc(R[p.chave] || '')}"
        oninput="window.setTexto('${p.chave}',this)"
        onblur="window.conferirCampo('${p.chave}')">${err}${selo}</div>`;
  }

  if (p.tipo === 'select') {
    const ops = p.opcoes.map(o2 => `<option value="${o2.valor}" ${R[p.chave] === o2.valor ? 'selected' : ''}>${esc(o2.rotulo)}</option>`).join('');
    return `<div class="campo" data-campo="${p.chave}"><label>${esc(p.enunciado)}${marca}</label>${dica}
      <select onchange="window.set('${p.chave}',this.value)"><option value="">Selecione…</option>${ops}</select>${err}</div>`;
  }

  const ops = p.opcoes.map(o2 => `
    <label class="opcao ${R[p.chave] === o2.valor ? 'marcada' : ''} ${o2.descricao ? 'com-desc' : ''}">
      <input type="radio" name="${p.chave}" value="${o2.valor}" ${R[p.chave] === o2.valor ? 'checked' : ''}
        onchange="window.set('${p.chave}',this.value)">
      <span class="texto-opcao"><b>${esc(o2.rotulo)}</b>${o2.descricao ? `<span class="desc">${esc(o2.descricao)}</span>` : ''}</span>
    </label>`).join('');
  // Opção curta e sem descrição vira grade: uma barra de 800 px escrita "Sim"
  // é ruído visual, não escolha.
  const curtas = p.opcoes.every(x => !x.descricao && x.rotulo.length <= 26);
  return `<div class="campo" data-campo="${p.chave}"><label>${esc(p.enunciado)}${marca}</label>${dica}<div class="opcoes ${curtas ? 'curtas' : ''}">${ops}</div>${err}</div>`;
}

/** A trilha do topo, com a conferência como último passo. */
function trilhaDePassos() {
  const etapas = [...BLOCOS.map(b => ({ numero: b.numero, titulo: b.titulo })),
                  { numero: REVISAO, titulo: 'Conferência' }];
  return `<div class="passos">` + etapas.map((e, i) =>
    `<div class="passo ${e.numero === etapa ? 'ativo' : e.numero < etapa ? 'feito' : ''}"
      onclick="window.irPara(${e.numero})">${i + 1}. ${esc(e.titulo)}</div>`).join('') + `</div>`;
}

/** Oferece retomar o rascunho. Aparece só na etapa 1 e só enquanto a pessoa não
 *  decidiu — depois de retomar ou recomeçar, sai da tela. */
function faixaDeRetomada() {
  const d = R._retomavel;
  if (!d || etapa !== 1) return '';
  const quando = new Date(d.salvoEm);
  const data = isNaN(quando) ? '' :
    ` de ${quando.toLocaleDateString('pt-BR')} às ${quando.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
  const nome = d.respostas && d.respostas.nomeEmpresa;
  return `<div class="retomar">
    <div>
      <b>Você tem um preenchimento começado${data}${nome ? `, de ${esc(nome)}` : ''}.</b>
      <span>Fica guardado só neste navegador — nada foi enviado.</span>
    </div>
    <div class="botoes">
      <button class="principal" onclick="window.retomarRascunho()">Retomar</button>
      <button class="secundario" onclick="window.comecarDeNovo()">Começar de novo</button>
    </div>
  </div>`;
}

function renderFormulario() {
  const bloco = BLOCOS[etapa - 1];
  const perguntas = perguntasVisiveis(R).filter(p => p.bloco === bloco.numero);
  const passos = trilhaDePassos();

  app.innerHTML = `${faixaDeRetomada()}${passos}
    <div class="cartao">
      <h1>${esc(bloco.titulo)}</h1>
      <p class="etapa-conta">Etapa ${etapa} de ${TOTAL}</p>
      ${bloco.aviso ? `<div class="escopo">${esc(bloco.aviso)}</div>` : ''}
      ${bloco.glossario ? `<dl class="glossario">${bloco.glossario.map(([termo, oQue]) =>
        `<dt>${esc(termo)}</dt><dd>${esc(oQue)}</dd>`).join('')}</dl>` : ''}
      ${perguntas.map(campo).join('')}
      <div class="rodape-nav">
        <button class="secundario" ${etapa === 1 ? 'disabled' : ''} onclick="window.voltar()">Voltar</button>
        <button class="principal" onclick="window.avancar()">${etapa === TOTAL ? 'Conferir respostas' : 'Próximo'}</button>
      </div>
    </div>`;
}

/** A resposta de uma pergunta, escrita como o respondente a leria.
 *  Devolve null quando ficou em branco (só acontece em campo facultativo). */
function respostaLegivel(p) {
  const v = R[p.chave];
  if (p.tipo === 'matriz') {
    const m = v || {};
    const linhas = (p.linhas || []).map(l => {
      const col = (p.colunas || []).find(c => c.valor === m[l.chave]);
      const vazio = m[l.chave] === undefined;
      return `<span class="linha-matriz ${m[l.chave] === p.naoSei ? 'na' : ''}">${esc(l.rotulo)}:
        <b>${esc(vazio ? 'não respondido' : col ? col.rotulo : m[l.chave])}</b></span>`;
    });
    return { html: linhas.join(''), lacuna: (p.linhas || []).some(l => m[l.chave] === p.naoSei) };
  }
  if (!v || !String(v).trim()) return null;
  if (p.tipo === 'consentimento') {
    return { html: 'Concordou com o uso das informações', lacuna: false };
  }
  if (p.opcoes) {
    const o2 = p.opcoes.find(x => x.valor === v);
    return { html: esc(o2 ? o2.rotulo : v), lacuna: v === p.naoSei };
  }
  return { html: esc(v), lacuna: false };
}

function renderRevisao() {
  const visiveis = perguntasVisiveis(R);
  const decide = p => p.alimenta.includes('modalidade') || p.alimenta.includes('elegibilidade');
  const conf = confianca(R);

  const linha = p => {
    const r = respostaLegivel(p);
    const classe = r === null ? 'vazia' : r.lacuna ? 'lacuna' : '';
    const texto = r === null ? 'não respondido' : r.html;
    return `<div class="rev-linha">
      <div class="pergunta">${esc(p.enunciado)}${decide(p) ? '<span class="decide">decide</span>' : ''}</div>
      <div class="resposta ${classe}">${texto}</div>
      <button class="alterar" onclick="window.irParaCampo(${p.bloco}, '${p.chave}')">alterar</button>
    </div>`;
  };

  const blocos = BLOCOS.map((b, i) => {
    const doBloco = visiveis.filter(p => p.bloco === b.numero);
    if (!doBloco.length) return '';
    return `<div class="rev-bloco">
      <h3>${esc(b.titulo)}</h3>
      <p class="conta">Etapa ${i + 1} · ${doBloco.length} ${doBloco.length === 1 ? 'resposta' : 'respostas'}</p>
      ${doBloco.map(linha).join('')}
    </div>`;
  }).join('');

  app.innerHTML = `${trilhaDePassos()}
    <div class="cartao">
      <h1>Confira antes de ver o resultado</h1>
      <p class="etapa-conta">Último passo · ${visiveis.length} respostas</p>
      <p style="font-size:var(--t-corpo);color:var(--cinza);line-height:1.6;max-width:74ch;margin:0 0 22px">
        As marcadas <span class="decide">decide</span> são as que mudam a recomendação. Vale um
        olhar nelas — depois do resultado ninguém volta procurar o que ficou errado.</p>

      ${conf.lacunasLegiveis.length ? `<div class="rev-aviso">
        <b>${conf.lacunasLegiveis.length === 1 ? 'Um ponto ficou' : `${conf.lacunasLegiveis.length} pontos ficaram`} em "não sei"</b>,
        e ${conf.lacunasLegiveis.length === 1 ? 'ele pesa' : 'eles pesam'} na decisão:
        <ul>${conf.lacunasLegiveis.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
        Se algum desses dados estiver a um telefonema de distância, vale buscar agora. Se não,
        siga: o resultado sai marcado como indicativo e o plano de ação inclui levantar
        ${conf.lacunasLegiveis.length === 1 ? 'esse ponto' : 'esses pontos'}.</div>` : ''}

      ${blocos}

      <div class="rodape-nav">
        <button class="secundario" onclick="window.voltar()">Voltar</button>
        <button class="principal" onclick="window.avancar()">Ver diagnóstico</button>
      </div>
    </div>`;
}

/* ------------------------------------------------------------------ protocolo
 * Sem protocolo, uma resposta que chega à casa não se liga à pessoa que a mandou
 * nem à tela que ela viu. Gerado uma vez, guardado no rascunho. */
function protocolo() {
  if (!R._protocolo) {
    const d = new Date();
    const dia = `${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const sorteio = Math.random().toString(36).slice(2, 6).toUpperCase();
    R._protocolo = `DS-${dia}-${sorteio}`;
    salvarRascunho();
  }
  return R._protocolo;
}

/* --------------------------------------------------------------------- envio
 * Enquanto não houver canal configurado, o portal NÃO finge que enviou: diz que
 * as respostas ficaram no navegador. Meio-caminho aqui viraria lead perdido em
 * silêncio, que é pior que ausência declarada de envio. */
const temCanalDeEnvio = () => !!(CONFIG.endpointEnvio || CONFIG.whatsapp);

function pacoteDeEnvio(d) {
  const respostas = {};
  for (const [k, v] of Object.entries(R)) if (!k.startsWith('_')) respostas[k] = v;
  return {
    protocolo: protocolo(),
    convite: CONVITE,
    enviadoEm: new Date().toISOString(),
    versaoFormulario: R.versaoFormulario,
    diagnostico: {
      saida: d.saida.codigo,
      posicao: d.posicao.rotulo,
      certeza: d.posicao.certeza,
      urgencia: d.urgencia,
      confianca: d.confianca.nivel,
      lacunas: d.confianca.lacunas,
      gatilhos: d.gatilhos,
      pontosEmAberto: d.posicao.pontosEmAberto || [],
    },
    respostas,
    // Conferência interna: o nome de quem responde consta do quadro de sócios?
    solicitanteNoQsa: R._solicitanteNoQsa,
  };
}

/** Nome do arquivo do plano de ação.
 *
 *  O navegador NÃO deixa uma página salvar arquivo sozinha — seria porta aberta
 *  para qualquer site escrever no computador de quem visita. O que dá para
 *  fazer, e é o que se faz aqui: o Chrome usa o TÍTULO do documento como nome
 *  sugerido ao salvar em PDF. Então o título vira o nome do arquivo, e a pessoa
 *  só confirma. */
const TITULO_DA_ABA = document.title;
function nomeDoArquivo() {
  const semAcento = (R.nomeEmpresa || 'Empresa')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const limpo = semAcento.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
  return 'Plano-De-Acao-SN-' + (limpo || 'Empresa');
}

window.voltarDoRelatorio = () => {
  document.title = TITULO_DA_ABA;
  etapa = RESULTADO; desenharDoTopo();
};
window.imprimirRelatorio = () => {
  if (etapa !== RELATORIO) { etapa = RELATORIO; desenhar(); }
  document.title = nomeDoArquivo();
  setTimeout(() => window.print(), 120);
};

/** Leva ao relatório e já abre a janela de salvar. É o mais próximo de
 *  "download automático" que existe sem instalar nada no computador de quem
 *  responde. */
window.baixarPlano = () => {
  etapa = RELATORIO;
  desenharDoTopo();
  document.title = nomeDoArquivo();
  setTimeout(() => window.print(), 400);
};

/* Dispara uma vez por preenchimento. Sem esta trava, `desenhar()` chamado pelo
   próprio envio reentraria aqui e mandaria o pacote de novo. */
let envioAutomaticoFeito = false;

/** Envia sozinho ao chegar no resultado.
 *
 *  Por que deixou de ser botão: em produção os clientes preenchiam até o fim e
 *  não clicavam em enviar. O diagnóstico não chegava à Auster e não era emitido
 *  — o trabalho da pessoa se perdia, e o dela era o trabalho todo.
 *
 *  Duas condições, e as duas são de princípio: só com endpoint configurado —
 *  nunca abre WhatsApp sozinho, que é ação com efeito externo — e só com o
 *  aceite de privacidade dado, que é a base legal para guardar. */
function enviarAoConcluir() {
  if (envioAutomaticoFeito || R._envio) return;
  if (!CONFIG.endpointEnvio || R.aceiteLgpd !== 'sim') return;
  envioAutomaticoFeito = true;
  setTimeout(() => window.enviarRespostas(), 60);
}

window.enviarRespostas = async () => {
  const d = diagnosticar(R, agora());
  const pacote = pacoteDeEnvio(d);

  if (CONFIG.endpointEnvio) {
    R._envio = 'enviando';
    desenhar();
    try {
      const resp = await fetch(CONFIG.endpointEnvio, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(pacote),
      });
      R._envio = resp.ok ? 'enviado' : 'falhou';
      if (!resp.ok) R._envioMotivo = `HTTP ${resp.status}`;
    } catch (e) {
      R._envio = 'falhou';
      R._envioMotivo = (e && e.message) || 'sem conexão';
    }
    salvarRascunho();
    desenhar();
    return;
  }

  if (CONFIG.whatsapp) {
    const texto = [
      `Diagnóstico Simples padrão x híbrido — protocolo ${pacote.protocolo}`,
      `Empresa: ${R.nomeEmpresa || '-'} (${R.cnpj || '-'})`,
      `Respondente: ${R.solicitante || '-'} · ${R.email || '-'} · ${R.telefone || '-'}`,
      `Resultado: ${d.posicao.rotulo} (${d.posicao.qualificador || ''})`,
      'Quero falar com a equipe sobre este resultado.',
    ].join(String.fromCharCode(10));
    window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto)}`, '_blank');
    R._envio = 'encaminhado';
    salvarRascunho();
    desenhar();
  }
};

const DIAGNOSTICO_OFICIAL = 'https://consultoria.austercontabil.com.br/diagnostico-reforma';

/** Este formulário decide UMA coisa: guia única ou por fora do DAS. Quem não é
 *  optante do Simples não tem essa escolha — e não deve descobrir isso depois de
 *  responder cinco blocos. O desvio acontece na etapa em que a resposta aparece. */
function atalhoDeTriagem() {
  if (R.ehSimei === 'sim') return 'mei';
  if (R.regimeAtual && R.regimeAtual !== 'simples' && R.regimeAtual !== 'nao_sei') return 'fora';
  return null;
}

function renderEncaminhamento(motivo) {

        : 'A escolha entre recolher IBS e CBS na guia única ou por fora existe só para o optante do Simples Nacional. No seu caso a pergunta é outra — e é maior: como a sua empresa se posiciona na Reforma como um todo.'}</p>

      <div class="botoes">

        <button class="secundario" onclick="window.irPara(1)">Voltar e corrigir</button>
      </div>
    </div>`;
}

/** Resumo do preenchimento, por bloco. Existe por duas razões: o cliente leva
 *  no papel o que declarou, e a equipe confere a leitura contra a resposta. */
function resumoDoPreenchimento() {
  const visiveis = perguntasVisiveis(R);
  return BLOCOS.map(b => {
    const doBloco = visiveis.filter(p => p.bloco === b.numero
      && p.tipo !== 'consentimento' && p.tipo !== 'textarea');
    if (!doBloco.length) return '';
    const linhas = doBloco.map(p => {
      const resp = respostaLegivel(p);
      return `<tr><td class="p">${esc(p.enunciado)}</td>
        <td class="r ${resp && resp.lacuna ? 'lacuna' : ''}">${resp ? resp.html : '—'}</td></tr>`;
    }).join('');
    return `<h3>${esc(b.titulo)}</h3>
      <table class="resumo"><tbody>${linhas}</tbody></table>`;
  }).join('');
}

        <table class="cabecalho-doc"><tbody>

          <tr><td>CNPJ</td><th>${esc(R.cnpj || '—')}</th></tr>
          <tr><td>Quem respondeu</td><th>${esc(R.solicitante || '—')}</th></tr>

        </tbody></table>

        <div class="doc-decisao ${d.posicao.certeza}">

          <p>${esc(d.posicao.acaoUnica)}</p>
        </div>

/* ------------------------------------------------------------------ rascunho
 * Dez minutos de preenchimento perdidos por um F5 acidental é defeito de
 * produto, não descuido do respondente. Guarda local, no próprio navegador:
 * nada sai da máquina, e por isso não depende de servidor nem de consentimento.
 * Os campos internos (prefixo _) ficam fora — são derivados e o QSA nunca
 * deve ser persistido. */
const CHAVE_RASCUNHO = 'auster-decisao-simples-rascunho';
let relogioRascunho = null;

function salvarRascunho() {
  clearTimeout(relogioRascunho);
  relogioRascunho = setTimeout(() => {
    try {
      const limpo = {};
      for (const [k, v] of Object.entries(R)) if (!k.startsWith('_')) limpo[k] = v;
      if (R._protocolo) limpo._protocolo = R._protocolo;
      localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify({
        salvoEm: new Date().toISOString(), etapa, respostas: limpo,
      }));
    } catch { /* aba privada, cota cheia: seguir sem rascunho */ }
  }, 600);
}

function lerRascunho() {
  try {
    const bruto = localStorage.getItem(CHAVE_RASCUNHO);
    if (!bruto) return null;
    const d = JSON.parse(bruto);
    if (!d || !d.respostas || !Object.keys(d.respostas).length) return null;
    return d;
  } catch { return null; }
}

function apagarRascunho() {
  try { localStorage.removeItem(CHAVE_RASCUNHO); } catch { }
}

window.retomarRascunho = () => {
  const d = lerRascunho();
  if (!d) return;
  Object.assign(R, d.respostas);
  etapa = Math.min(d.etapa || 1, TOTAL);
  delete R._retomavel;
  desenharDoTopo();
};

window.comecarDeNovo = () => {
  apagarRascunho();
  for (const k of Object.keys(R)) delete R[k];
  etapa = 1;
  desenharDoTopo();
};

/** Limpa o erro exibido de um campo sem redesenhar a etapa inteira. */
function limparErro(chave) {
  const el = document.querySelector(`[data-campo="${chave}"] .erro`);
  if (el) el.remove();
}

/** Atualiza só a marcação visual das opções de um campo. */
/** Repinta as opções de um campo. O `name` pode ser "chave" ou, na matriz,
 *  "chave__linha" — e nesse caso o valor mora em R[chave][linha], não em R[name].
 *
 *  DEFEITO CORRIGIDO 15/09/2026: a versão anterior comparava `inp.value` com
 *  `R[name]`. Para a matriz, R[name] é undefined (o valor está um nível abaixo),
 *  então toda comparação dava falso e a função DESMARCAVA o radio que o
 *  respondente acabara de clicar. O sintoma era "o não sei não marca" — o estado
 *  guardava a resposta, a tela não mostrava. */
function valorDoCampo(nome) {
  const i = nome.indexOf('__');
  if (i === -1) return R[nome];
  const chave = nome.slice(0, i), linha = nome.slice(i + 2);
  return (R[chave] || {})[linha];
}

function repintarOpcoes(nome) {
  const atual = valorDoCampo(nome);
  document.querySelectorAll(`input[name="${nome}"]`).forEach(inp => {
    const marcado = inp.value === atual;
    // `checked` também, e não só a classe: quando a resposta vem da consulta ao
    // CNPJ (regime e MEI), nenhum clique aconteceu para marcar o radio.
    if (inp.checked !== marcado) inp.checked = marcado;
    const rotulo = inp.closest('.opcao');
    if (rotulo) rotulo.classList.toggle('marcada', marcado);
  });
}

/** Selo do cadastro, derivado do estado — nunca criado à mão, para não sumir
 *  quando a etapa é redesenhada. */
function seloCadastro() {
  if (R._cadastroEstado === 'buscando')
    return '<div class="cadastro buscando">Conferindo o cadastro na Receita…</div>';
  // Falhar em silêncio foi um defeito real: o campo ficava vazio e não havia como
  // distinguir "a consulta não funcionou" de "isso não foi implementado".
  if (R._cadastroEstado === 'falhou') {
    const local = R._cadastroMotivo === 'bloqueado por abrir o arquivo direto';
    return `<div class="cadastro alerta">${local
      ? 'A consulta automática do CNPJ não funciona com o arquivo aberto direto do computador — o navegador bloqueia a chamada. Ela passa a funcionar quando o portal estiver publicado. <b>Preencha o nome da empresa à mão.</b>'
      : `Não deu para consultar o CNPJ agora (${esc(R._cadastroMotivo || 'indisponível')}). <b>Preencha o nome da empresa à mão</b> — o diagnóstico segue igual.`}</div>`;
  }
  const d = R._cadastro;
  if (!d) return '';
  const partes = [`<b>${esc(d.razaoSocial || '')}</b>`];
  if (d.municipio) partes.push(`${esc(d.municipio)}/${esc(d.uf || '')}`);
  partes.push(d.optanteSimples ? 'optante pelo Simples' : 'não optante pelo Simples');
  if (d.optanteMei) partes.push('MEI');
  const aviso = d.ativa ? ''
    : `<br>Situação cadastral: <b>${esc(d.situacao || 'não ativa')}</b>. Confirme antes de seguir.`;
  return `<div class="cadastro ${d.ativa ? 'achou' : 'alerta'}">${partes.join(' · ')}${aviso}</div>`;
}

// ------------------------------------------------- consulta cadastral
let ultimoCnpjBuscado = null;

/** Troca só o selo no DOM, sem tocar no resto da etapa. */
function atualizarSelo() {
  const campo = document.querySelector('[data-campo="cnpj"]');
  if (!campo) return;
  const atual = campo.querySelector('.cadastro');
  if (atual) atual.remove();
  const html = seloCadastro();
  if (html) campo.insertAdjacentHTML('beforeend', html);
}

function conferirSolicitanteNoQsa() {
  if (!R._qsa) return;
  R._solicitanteNoQsa = nomeConstaNoQsa(R.solicitante, R._qsa);
}

/** Consulta cadastral. Silenciosa no erro: o formulário segue manual. */
async function buscarCadastro(cnpj) {
  const limpo = String(cnpj).replace(/[^0-9A-Za-z]/g, '');
  // Só evita repetir a chamada se o resultado daquele CNPJ ainda está em mão.
  // Sem a segunda condição, voltar a um CNPJ já consultado (depois de o selo ter
  // sido limpo) não reconsultava e o campo ficava mudo.
  // Repetir a consulta do MESMO CNPJ só se evita quando o resultado ainda está
  // em mão. Depois de uma falha, sair e voltar ao campo tenta de novo.
  if (limpo === ultimoCnpjBuscado && R._cadastro) return;
  ultimoCnpjBuscado = limpo;

  R._cadastroEstado = 'buscando';
  atualizarSelo();

  const r = await consultarCnpj(cnpj);

  if (!r.ok) {
    R._cadastro = null;
    R._cadastroEstado = 'falhou';
    R._cadastroMotivo = r.motivo || null;
    // O detalhe técnico vai para o console, não para a tela.
    console.warn('consulta de CNPJ falhou:', r.motivo, r.detalhe || '');
    atualizarSelo();
    return;
  }

  const d = r.dados;
  R._cadastro = d;
  R._qsa = r.qsa;            // guardado para conferência, NUNCA renderizado
  R._solicitanteNoQsa = R.solicitante ? nomeConstaNoQsa(R.solicitante, r.qsa) : null;

  // Pré-preenche só o que é da empresa e o respondente ainda não escreveu.
  if (d.razaoSocial && !R.nomeEmpresa) {
    R.nomeEmpresa = d.razaoSocial;
    const campo = document.querySelector('[data-campo="nomeEmpresa"] input');
    if (campo) campo.value = d.razaoSocial;
  }
  if (!R.ehSimei) R.ehSimei = d.optanteMei ? 'sim' : 'nao';
  if (!R.regimeAtual && d.optanteSimples) R.regimeAtual = 'simples';
  // Marca na tela o que veio do cadastro. Sem isto o estado dizia "Simples" e o
  // formulario aparecia em branco, obrigando o respondente a responder de novo.
  repintarOpcoes('ehSimei');
  repintarOpcoes('regimeAtual');

  R._cadastroEstado = 'pronto';
  // Não redesenha a etapa: o respondente pode já estar digitando o campo
  // seguinte, e o innerHTML tiraria o foco dele. Troca só o selo.
  atualizarSelo();
}

// ---------------------------------------------------------------- ações
/** Campos de texto: grava e sai. Redesenhar aqui destruiria o input e o foco.
 *  A máscara é aplicada no próprio elemento, preservando a posição do cursor
 *  quando o texto é digitado no fim (que é o caso normal). */
window.setTexto = (chave, elemento) => {
  const p = PERGUNTAS.find(x => x.chave === chave);
  let valor = elemento.value;
  if (p && p.validador && p.validador.mascara) {
    // selectionStart lança em alguns tipos de input (email, number). Só campos
    // com máscara chegam aqui — text e tel — mas o try protege contra regressão.
    let noFim = true, cursor = null;
    try { cursor = elemento.selectionStart; noFim = cursor === valor.length; } catch { }
    const mascarado = p.validador.mascara(valor);
    if (mascarado !== valor) {
      elemento.value = mascarado;
      if (!noFim && cursor !== null) {
        try {
          const pos = Math.min(cursor, mascarado.length);
          elemento.setSelectionRange(pos, pos);
        } catch { }
      }
    }
    valor = mascarado;
  }
  R[chave] = valor;
  salvarRascunho();
  if (erros[chave]) { delete erros[chave]; limparErro(chave); }

  // Mudou o CNPJ? O selo do cadastro anterior não vale mais. Sem isso, um CNPJ
  // novo (ou inválido) fica exibindo a razão social do que foi consultado antes.
  if (chave === 'cnpj') {
    const limpo = String(valor).replace(/[^0-9A-Za-z]/g, '');
    if (limpo !== ultimoCnpjBuscado && (R._cadastro || R._cadastroEstado)) {
      R._cadastro = null; R._cadastroEstado = null; R._cadastroMotivo = null;
      R._qsa = null; R._solicitanteNoQsa = null;
      atualizarSelo();
    }
  }
};

/** Validação ao sair do campo, para o erro aparecer antes de clicar em avançar. */
window.conferirCampo = chave => {
  const p = PERGUNTAS.find(x => x.chave === chave);
  const v = R[chave];
  if (!p || !p.validador || !v || !String(v).trim()) return;
  if (p.validador.valida(v)) {
    delete erros[chave]; limparErro(chave);
    if (chave === 'cnpj') buscarCadastro(v);
    if (chave === 'solicitante') conferirSolicitanteNoQsa();
    return;
  }
  erros[chave] = p.validador.erro;
  const caixa = document.querySelector(`[data-campo="${chave}"]`);
  if (caixa && !caixa.querySelector('.erro')) {
    const el = document.createElement('div');
    el.className = 'erro'; el.textContent = p.validador.erro;
    caixa.appendChild(el);
  }
};

window.set = (chave, valor) => {
  salvarRascunho();
  const antes = assinaturaVisivel();
  R[chave] = valor;
  salvarRascunho();
  if (erros[chave]) { delete erros[chave]; limparErro(chave); }
  const visiveis = new Set(perguntasVisiveis(R).map(p => p.chave));
  for (const p of PERGUNTAS) if (!visiveis.has(p.chave)) delete R[p.chave];
  // Só redesenha se a resposta mudou quais perguntas aparecem.
  if (assinaturaVisivel() !== antes) desenhar(); else repintarOpcoes(chave);
};

window.setMatriz = (chave, linha, valor) => {
  salvarRascunho();
  const antes = assinaturaVisivel();
  R[chave] = { ...(R[chave] || {}), [linha]: valor };
  if (erros[chave]) { delete erros[chave]; limparErro(chave); }
  // A matriz abre e fecha pergunta na MESMA etapa (o regime dos clientes so faz
  // sentido se houver cliente pessoa juridica). Sem este guarda a pergunta so
  // aparecia ao sair e voltar da etapa.
  if (assinaturaVisivel() !== antes) { desenhar(); return; }
  repintarOpcoes(`${chave}__${linha}`);
  const el = document.querySelector(`[data-campo="${chave}"] .soma`);
  if (el) {
    const rod = rodapeMatriz(chave);
    el.className = `soma ${rod.classe}`;
    el.textContent = rod.texto;
  }
};
window.avancar = () => {
  if (etapa >= RESULTADO) return;
  // Da conferência para o resultado não há o que validar: tudo já passou.
  if (etapa === REVISAO) { etapa = RESULTADO; desenharDoTopo(); return; }
  const problemas = problemasNaEtapa(BLOCOS[etapa - 1].numero);
  Object.keys(erros).forEach(k => delete erros[k]);
  if (Object.keys(problemas).length) {
    Object.assign(erros, problemas);
    desenhar();
    const primeiro = document.querySelector('.campo .erro');
    if (primeiro) primeiro.closest('.campo').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const motivo = atalhoDeTriagem();
  if (motivo) {
    R._etapaAntesDoDesvio = etapa;
    etapa = TOTAL + 1; R._encaminhar = motivo; desenharDoTopo(); return;
  }
  etapa++; salvarRascunho(); desenharDoTopo();
};
// Sair do encaminhamento tem de apagar o desvio, senão a tela volta a ele.
window.voltar = () => {
  if (R._encaminhar) {
    delete R._encaminhar;
    etapa = R._etapaAntesDoDesvio || 1;
    desenharDoTopo(); return;
  }
  if (etapa > 1) { etapa--; desenharDoTopo(); }
};
window.irPara = n => {
  if (R._encaminhar) { delete R._encaminhar; etapa = n; desenharDoTopo(); return; }
  if (n < etapa) { etapa = n; desenharDoTopo(); }
};

/** Vai ao bloco da pergunta e põe o campo à vista. Usado pelo "alterar" da
 *  conferência: mandar para o topo do bloco 4 e deixar a pessoa procurar a
 *  pergunta seria transferir a ela um trabalho que a tela sabe fazer. */
window.irParaCampo = (bloco, chave) => {
  etapa = bloco;
  desenhar();
  window.scrollTo(0, 0);
  const alvo = document.querySelector(`[data-campo="${chave}"]`);
  if (alvo) {
    alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
    alvo.classList.add('destacado');
    setTimeout(() => alvo.classList.remove('destacado'), 1800);
  }
};

/* Arranque. Um rascunho encontrado NÃO é restaurado sozinho: a pessoa pode estar
 * preenchendo para outra empresa. Oferece, e só retoma se ela pedir. */
/* Convite: o que a casa já sabe entra pronto, e só o que está em branco — nunca
 * sobrescreve resposta de quem está preenchendo. */
if (typeof window !== 'undefined' && window.__PREVIO__) {
  for (const [chave, valor] of Object.entries(window.__PREVIO__)) {
    if (valor && !R[chave]) R[chave] = valor;
  }
}

/* Modo relatório: o backoffice abre esta mesma página com as respostas de uma
 * resposta já recebida, para imprimir o plano de ação em PDF. Reaproveita o
 * desenho que o portal já faz — sem segunda implementação para divergir.
 *
 * Aqui NÃO se salva rascunho e NÃO se envia nada: é leitura de algo que já foi
 * respondido e gravado. Sem esta guarda, abrir a ficha de um cliente no
 * backoffice criaria uma resposta nova em nome dele. */
if (typeof window !== 'undefined' && window.__SO_RELATORIO__) {
  for (const [chave, valor] of Object.entries(window.__SO_RELATORIO__)) R[chave] = valor;
  if (window.__PROTOCOLO__) R._protocolo = window.__PROTOCOLO__;
  R._envio = 'enviado';          // veio do banco: já está recebido
  etapa = RELATORIO;
  desenharDoTopo();
  document.title = nomeDoArquivo();
} else {
  const rascunho = lerRascunho();
  if (rascunho) R._retomavel = rascunho;
  desenhar();
}
</script>
